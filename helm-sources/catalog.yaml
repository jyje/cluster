repositories:
  argo:
    type: http
    url: https://argoproj.github.io/argo-helm
  tarampampam:
    type: oci
    url: oci://ghcr.io/tarampampam/error-pages/charts
  bitnami-sealed-secrets:
    type: http
    url: https://bitnami.github.io/sealed-secrets

charts:
  error-pages:
    repository: tarampampam
    group: error-pages
    chart: error-pages
    applications:
      - clusters/r4spi/apps/error-pages.yaml
  sealed-secrets:
    repository: bitnami-sealed-secrets
    group: sealed-secrets
    chart: sealed-secrets
    applications:
      - clusters/r4spi/apps/sealed-secrets.yaml
  argocd-image-updater:
    repository: argo
    group: argo
    chart: argocd-image-updater
    applications:
      - clusters/r4spi/apps/argocd-image-updater.yaml
