name: 🤖 renovate

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "full: preview only. off: create branches and PRs"
        type: choice
        options: ["full", "lookup", "off"]
        default: "full"
      helm-profile:
        description: "all or a provider/chart from helm-sources/catalog.yaml"
        type: string
        default: "all"
      update-mode:
        description: "normal: honor closed PRs. force: retry closed PRs"
        type: choice
        options: ["normal", "force"]
        default: "normal"
      expected-version:
        description: "Optional exact version when selecting one chart"
        type: string
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  pull_request:
    paths:
      - ".github/workflows/renovate.yaml"
      - "helm-sources/catalog.yaml"
      - "helm-sources/extra-resources-policy.json"
      - "tools/renovate/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('renovate-check-{0}', github.event.pull_request.number) || 'renovate' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{ github.repository == 'jyje/cluster' &&
      (github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: cluster

      - uses: actions/checkout@v7
        with:
          repository: renovatebot/renovate
          ref: 182de2759f0bb31ee6216f4076875948d39c4c1b # 44.149.2
          persist-credentials: false
          path: upstream

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install the pinned Renovate sources
        shell: bash
        run: |
          git -C upstream apply --check --unidiff-zero ../cluster/tools/renovate/artifact-only.patch
          git -C upstream apply --unidiff-zero ../cluster/tools/renovate/artifact-only.patch
          mkdir upstream/lib/modules/manager/helm-vendor
          cp cluster/tools/renovate/helm-vendor/*.ts upstream/lib/modules/manager/helm-vendor/
          cd upstream
          corepack pnpm install --frozen-lockfile --ignore-scripts
          node tools/generate-imports.mjs
      - name: Plan chart jobs from the catalog
        id: matrix
        working-directory: upstream
        env:
          SELECTOR: ${{ inputs.helm-profile || 'all' }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { valid } from 'semver';
          import { selectProfiles } from './lib/modules/manager/helm-vendor/index.ts';

          const { SELECTOR, EXPECTED_VERSION, GITHUB_EVENT_NAME, GITHUB_OUTPUT, GITHUB_STEP_SUMMARY } = process.env;
          const catalog = readFileSync('../cluster/helm-sources/catalog.yaml', 'utf8');
          if (EXPECTED_VERSION && (SELECTOR === 'all' || !valid(EXPECTED_VERSION))) {
            throw new Error('An exact version can only be used with a single Helm chart.');
          }
          const include = selectProfiles(catalog, SELECTOR);
          if (GITHUB_EVENT_NAME === 'schedule') {
            include.unshift({ profile: '', selector: 'dependencies', key: 'dependencies' });
          }
          appendFileSync(GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\n');
          appendFileSync(GITHUB_STEP_SUMMARY, '## Renovate jobs\n\n' + include.map(({ selector }) => '- ' + selector).join('\n') + '\n');
          JS

      - name: Build and validate the native Renovate manager
        working-directory: upstream
        shell: bash
        run: |
          node --test ../cluster/tools/renovate/helm-vendor/run-summary.test.mjs
          node_modules/.bin/vitest run lib/modules/manager/helm-vendor/index.spec.ts
          node_modules/.bin/tsdown
          node dist/config-validator.js --strict --no-global ../cluster/renovate.json5

      - name: Package the Renovate runtime
        shell: bash
        run: |
          archive=helm-v3.21.4-linux-arm64.tar.gz
          mkdir "$RUNNER_TEMP/helm"
          curl --fail --silent --show-error --location "https://get.helm.sh/$archive" -o "$RUNNER_TEMP/helm/$archive"
          curl --fail --silent --show-error --location "https://get.helm.sh/$archive.sha256" -o "$RUNNER_TEMP/helm/$archive.sha256"
          (
            cd "$RUNNER_TEMP/helm"
            printf '%s  %s\n' "$(cat "$archive.sha256")" "$archive" | sha256sum --check
            tar -xzf "$archive"
          )
          mkdir "$RUNNER_TEMP/renovate-image"
          cp "$RUNNER_TEMP/helm/linux-arm64/helm" "$RUNNER_TEMP/renovate-image/helm"
          cp -R upstream/dist "$RUNNER_TEMP/renovate-image/dist"
          tar -cf "$RUNNER_TEMP/renovate-runtime.tar" -C "$RUNNER_TEMP/renovate-image" dist helm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-runtime
          path: ${{ runner.temp }}/renovate-runtime.tar
          retention-days: 1

  renovate:
    name: Renovate (${{ matrix.selector }})
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: cluster
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renovate-runtime
          path: ${{ runner.temp }}/renovate-artifact
      - name: Build the Renovate runtime image
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/renovate-image"
          tar -xf "$RUNNER_TEMP/renovate-artifact/renovate-runtime.tar" -C "$RUNNER_TEMP/renovate-image"
          docker build --file cluster/tools/renovate/Dockerfile --tag cluster-renovate:ci "$RUNNER_TEMP/renovate-image"
          image=$(docker image inspect --format '{{.Id}}' cluster-renovate:ci)
          echo "RENOVATE_IMAGE_ID=$image" >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name != 'pull_request'
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check Dependabot alerts access
        if: github.event_name == 'workflow_dispatch' && strategy.job-index == 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh api --silent "repos/${GITHUB_REPOSITORY}/dependabot/alerts?per_page=1"; then
            echo 'Dependabot alerts API is accessible to the GitHub App.'
          else
            echo '::warning::Dependabot alerts API access failed. Check the GitHub App and installation permissions.'
          fi

      - name: Run Renovate
        id: run
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          HELM_VENDOR_PROFILE: ${{ matrix.profile }}
          HELM_VENDOR_SELECTOR: ${{ matrix.selector }}
          HELM_VENDOR_EXPECTED_VERSION: ${{ inputs.expected-version }}
          HELM_VENDOR_UPDATE_MODE: ${{ inputs.update-mode || 'normal' }}
          RENOVATE_PRUNE_STALE_BRANCHES: "false"
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run != 'off' && inputs.dry-run || '' }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
          LOG_FILE: /renovate-out/renovate-log.jsonl
          LOG_FILE_LEVEL: debug
        run: |
          install -d -m 777 "$RUNNER_TEMP/renovate-out"
          if [[ -n "$HELM_VENDOR_PROFILE" ]]; then
            export RENOVATE_DEPENDENCY_DASHBOARD_TITLE="Dependency Dashboard (Helm $HELM_VENDOR_SELECTOR)"
            export RENOVATE_DEPENDENCY_DASHBOARD_AUTOCLOSE=true
            export RENOVATE_PACKAGE_RULES
            RENOVATE_PACKAGE_RULES=$(jq -cn \
              --arg version "$HELM_VENDOR_EXPECTED_VERSION" \
              --arg event "$GITHUB_EVENT_NAME" --arg mode "$HELM_VENDOR_UPDATE_MODE" '[
                {matchManagers: ["!helm-vendor"], enabled: false},
                ({matchManagers: ["helm-vendor"], schedule: [], prHourlyLimit: 0, separateMajorMinor: false} +
                  (if $version == "" then {} else {allowedVersions: ("=" + $version)} end) +
                  (if $event == "workflow_dispatch" and $mode == "force"
                   then {recreateWhen: "always"} else {} end))
              ]')
          else
            export RENOVATE_PACKAGE_RULES='[{"matchManagers":["helm-vendor"],"enabled":false}]'
          fi
          checkout_options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            export RENOVATE_PLATFORM=local RENOVATE_DRY_RUN=lookup RENOVATE_REPOSITORIES=
            checkout_options=(--volume "$GITHUB_WORKSPACE/cluster:/checkout:ro" --workdir /checkout
              --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/checkout)
          fi
          docker run --rm "${checkout_options[@]}" \
            --env RENOVATE_TOKEN --env RENOVATE_REPOSITORIES --env RENOVATE_DRY_RUN --env RENOVATE_PLATFORM \
            --env RENOVATE_ONBOARDING --env RENOVATE_REQUIRE_CONFIG \
            --env HELM_VENDOR_PROFILE --env RENOVATE_PACKAGE_RULES \
            --env RENOVATE_DEPENDENCY_DASHBOARD_TITLE --env RENOVATE_DEPENDENCY_DASHBOARD_AUTOCLOSE \
            --env RENOVATE_PRUNE_STALE_BRANCHES \
            --env LOG_LEVEL --env LOG_FILE --env LOG_FILE_LEVEL \
            --volume "$RUNNER_TEMP/renovate-out:/renovate-out" \
            "$RENOVATE_IMAGE_ID" renovate

      - name: Record Helm result
        if: ${{ !cancelled() && matrix.profile != '' }}
        id: result
        env:
          HELM_VENDOR_PROFILE: ${{ matrix.profile }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          RENOVATE_MODE: ${{ github.event_name == 'pull_request' && 'lookup' || inputs.dry-run || 'off' }}
          RENOVATE_OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/renovate-out"
          node cluster/tools/renovate/helm-vendor/run-summary.mjs record "$RUNNER_TEMP/renovate-out"

      - name: Verify published Helm branch and PR
        if: steps.result.outputs.branch != ''
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.result.outputs.branch }}
          COMMIT: ${{ steps.result.outputs.commit }}
          PR: ${{ steps.result.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [[ -n "$COMMIT" ]]; then
            test "$branch_sha" = "$COMMIT"
          fi
          if [[ -n "$PR" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
              jq -e --arg base "$DEFAULT_BRANCH" --arg branch "$BRANCH" --arg sha "$branch_sha" \
                '.base.ref == $base and .head.ref == $branch and .head.sha == $sha'
          fi

      - name: Record failed publication verification
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        run: node cluster/tools/renovate/helm-vendor/run-summary.mjs verification-failed "$RUNNER_TEMP/renovate-out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renovate-log-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/renovate-out/renovate-log.jsonl
            ${{ runner.temp }}/renovate-out/result.json
          retention-days: 7

  summary:
    name: Helm vendoring summary
    needs: [prepare, renovate]
    if: ${{ !cancelled() && needs.prepare.outputs.matrix != '' }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: renovate-log-helm-*
          path: ${{ runner.temp }}/renovate-results
      - name: Write the chart results table
        if: ${{ !cancelled() }}
        env:
          RENOVATE_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: node tools/renovate/helm-vendor/run-summary.mjs summary "$RUNNER_TEMP/renovate-results"
