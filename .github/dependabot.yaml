# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions (workflows in .github/workflows, action.yml in root)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ dep(github-actions)"

  # Dependencies declared in Helm charts, not whole-chart vendoring.
  - package-ecosystem: "helm"
    directories:
      - "/helm/*"
      - "/tools/renovate/comparison/helm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ dep(helm)"
