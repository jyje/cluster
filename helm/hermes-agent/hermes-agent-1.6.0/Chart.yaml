description: "\U0001F469\U0001F3FB\U0001F4BB A Helm chart to run Hermes Agent on Kubernetes,
  community-powered, lightweight  Run [Hermes Agent](https://github.com/NousResearch/hermes-agent)
  - a multi-provider LLM agent framework - on Kubernetes. Configure any provider Hermes
  supports (OpenAI, Anthropic, Gemini, OpenRouter, NVIDIA, or any OpenAI-compatible
  proxy such as LiteLLM/vLLM) entirely via values.yaml, with a built-in helm test
  health check. "
