# The upstream umbrella chart ships no values.yaml: its settings live in the
# higress-core and higress-console subcharts. This file only carries the
# repository's extraResources patch (see PATCH.md).

# -- Extra resources to deploy with the chart.
# Supports both object and string (multiline) formats. Helm template expressions are evaluated.
extraResources: []
  # Object format:
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value
  #
  # String format (multiline):
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #     namespace: "{{ .Release.Namespace }}"
