image:
  repository: ghcr.io/jyje/mungchilog
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: nginx-letsencrypt-prod
    # This app holds a personal travel itinerary (real names, dates,
    # locations), so it isn't left unauthenticated even in v1. Authentik
    # forward-auth isn't wired up for any app yet on this cluster (still
    # in progress): rather than pilot that here, gate access with
    # ingress-nginx's built-in Basic Auth, which is already proven.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mungchilog-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "mungchilog"
  host: mungchilog.app.jyje.online
  tlsSecretName: mungchilog.app.jyje.online
  # The static build (JS/CSS bundle, service worker, manifest, icons)
  # carries no personal data, only the document and /api/* do. Basic Auth
  # in front of the manifest/sw.js is a known trap for PWA installability
  # (cached HTTP-auth credentials don't reliably reach a service worker's
  # own registration/update fetches, especially once launched standalone
  # from the home screen) — verified locally: both 401 without
  # credentials. Carving these out into a second, unauthenticated Ingress
  # is what actually makes the M5 "install to home screen, view offline"
  # requirement work.
  publicPaths:
    - /assets
    - /sw\.js
    - /workbox-.*\.js
    - /registerSW\.js
    - /manifest\.webmanifest
    - /favicon\.svg
    - /pwa-(192|512)\.png

persistence:
  enabled: true
  # No block-storage StorageClass exists on this cluster (verified via
  # `kubectl get sc` — only the NFS-backed default `subdir-usb`, and Longhorn
  # is vendored under helm/longhorn but was never deployed as an
  # Application, so a values.yaml referencing "longhorn" was wrong and
  # left the PVC stuck Pending). Deploying Longhorn now, days before a
  # trip deadline, on a shared cluster other apps depend on, is out of
  # scope for this app. Using subdir-usb instead; the app mitigates the
  # known SQLite-over-NFS risk by running a single replica and forcing a
  # non-WAL journal mode (see apps/server/src/db.ts in jyje/mungchilog).
  storageClassName: subdir-usb
  size: 1Gi
  mountPath: /app/data
  # NOTE (2026-08-21): PersistentVolumeClaim.spec.storageClassName is
  # immutable, so this change alone cannot repair a PVC that Argo CD
  # already created against the (nonexistent) "longhorn" class, so it
  # would stay Pending forever. The one pre-existing "mungchilog-data"
  # claim from the initial M0 rollout was manually deleted via
  # `kubectl delete pvc mungchilog-data -n mungchilog` before this PR
  # merged (it had never bound, so there was no data to lose). A fresh
  # install of this chart hits this path directly and needs no
  # migration; this note only explains the one historical exception.

extraEnv: []
extraEnvFrom: []
extraResources: []
