apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          # Envoy's TCMalloc cannot map its heap on the 39-bit address space of
          # the 4 KB page (Raspberry Pi 4) nodes and crashes at startup. Keep the
          # proxies on the other nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: app.jyje.online/raspi.type
                        operator: NotIn
                        values: ["4b"]
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-web
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: "*.gateway.invalid"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-agent-henry
        kinds:
          - kind: HTTPRoute
    # HTTPS listeners for the apps that move first. They have no public entry
    # point yet: ingress-nginx still owns 80/443 on the nodes, so reach them
    # in-cluster or through a port-forward until the cutover. One listener per
    # host keeps each route attachable only from its own namespace.
    - name: https-app
      protocol: HTTPS
      port: 8443
      hostname: app.jyje.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: envoy-app-jyje-online-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: homer-instance
        kinds:
          - kind: HTTPRoute
    - name: https-error
      protocol: HTTPS
      port: 8443
      hostname: error.app.jyje.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: envoy-error-app-jyje-online-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: error-pages
        kinds:
          - kind: HTTPRoute
