# Pilot Gateway for the Hermes Henry dashboard route. It stays here for now;
# the other apps declare their own Gateway next to their route (see
# docs/networks/envoy-gateway-migration.md). It shares the proxy fleet of the
# envoy-web GatewayClass, so it takes no infrastructure of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-web
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: "*.gateway.invalid"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-agent-henry
        kinds:
          - kind: HTTPRoute
