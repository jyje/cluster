# Certificates for the envoy-web HTTPS listeners. They are explicit Certificate
# resources rather than Gateway annotations on purpose: while ingress-nginx
# still answers port 80, only its HTTP-01 solver can complete a challenge, and
# a Certificate keeps renewing after the old Ingress is gone. At the cutover
# the issuerRef moves to an issuer with the Gateway API solver.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-app-jyje-online
  namespace: envoy-gateway-system
spec:
  secretName: envoy-app-jyje-online-tls
  dnsNames:
    - app.jyje.online
  issuerRef:
    kind: ClusterIssuer
    name: nginx-letsencrypt-prod
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-error-app-jyje-online
  namespace: envoy-gateway-system
spec:
  secretName: envoy-error-app-jyje-online-tls
  dnsNames:
    - error.app.jyje.online
  issuerRef:
    kind: ClusterIssuer
    name: nginx-letsencrypt-prod
