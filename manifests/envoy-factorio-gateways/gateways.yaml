apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: factorio
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          # Envoy's TCMalloc cannot map its heap on the 39-bit address space of
          # the 4 KB page (Raspberry Pi 4) nodes and crashes at startup. Keep the
          # proxies on the other nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: app.jyje.live/raspi.type
                        operator: NotIn
                        values: ["4b"]
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.io/address-pool: factorio-private
          metallb.universe.tf/address-pool: factorio-private
        labels:
          networking.jyje.io/reserved-vip: factorio
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: factorio
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: factorio
  listeners:
    - name: game
      port: 34197
      protocol: UDP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: factorio
        kinds:
          - kind: UDPRoute
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          # Envoy's TCMalloc cannot map its heap on the 39-bit address space of
          # the 4 KB page (Raspberry Pi 4) nodes and crashes at startup. Keep the
          # proxies on the other nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: app.jyje.live/raspi.type
                        operator: NotIn
                        values: ["4b"]
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-web
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: "*.gateway.invalid"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-agent-henry
        kinds:
          - kind: HTTPRoute
