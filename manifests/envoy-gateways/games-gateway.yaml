apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: games
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          # Envoy's TCMalloc cannot map its heap on the 39-bit address space of
          # the 4 KB page (Raspberry Pi 4) nodes and crashes at startup. Keep the
          # proxies on the other nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: app.jyje.online/raspi.type
                        operator: NotIn
                        values: ["4b"]
      envoyService:
        type: LoadBalancer
        # The pool is created outside this repository, in the environment's
        # private configuration, and holds one reserved LAN address.
        annotations:
          metallb.io/address-pool: udp-private
          metallb.universe.tf/address-pool: udp-private
        labels:
          networking.jyje.io/reserved-vip: games
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: games
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: games
  listeners:
    - name: game
      port: 34197
      protocol: UDP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: gameplane-games
        kinds:
          - kind: UDPRoute
