# Shared class for the HTTP(S) Gateways. Each app declares its own Gateway,
# Certificate and HTTPRoute in its Argo CD Application (extraResources); this
# class merges them all onto one Envoy proxy fleet, so a new app does not add
# a proxy pod and the cutover has a single set of ports to move. Listeners
# must stay unique by port, protocol and hostname across the whole class.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-web
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-web
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-web
  namespace: envoy-gateway-system
spec:
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          # Envoy's TCMalloc cannot map its heap on the 39-bit address space of
          # the 4 KB page (Raspberry Pi 4) nodes and crashes at startup. Keep the
          # proxies on the other nodes.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: app.jyje.online/raspi.type
                        operator: NotIn
                        values: ["4b"]
      envoyService:
        # A fixed name, so a bridge Ingress can point at the proxy without a
        # generated hash in its backend.
        name: envoy-web
        type: ClusterIP
