apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/envoy-gateway/gateway-helm-v1.10.0
    helm:
      valuesObject:
        crds:
          enabled: false
        deployment:
          pod:
            annotations:
              # Roll the controller when the watch configuration changes.
              networking.jyje.io/watch-profile: factorio-henry-homer-error-gameplane-v3
        config:
          envoyGateway:
            provider:
              type: Kubernetes
              kubernetes:
                watch:
                  type: Namespaces
                  namespaces:
                    - envoy-gateway-system
                    - factorio
                    - hermes-agent-henry
                    - homer-instance
                    - error-pages
                    - gameplane-system
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  # Sync after the separate Envoy Gateway CRDs are established.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
