apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Production deployment, migrated from the mungchilog namespace. The
  # temporary migration host/redirect URI have been cut over to the
  # production domain and mungchilog-legacy has been retired.
  name: mungchilog-prd
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/mungchilog.git
    targetRevision: prd
    path: charts/mungchilog
    helm:
      valuesObject:
        image:
          # :managed intentionally does not exist in GHCR. Image Updater
          # immediately replaces it through an Argo CD Helm parameter with a
          # permitted immutable GitHub workflow-run and short-SHA tag.
          tag: managed
        # Coordinates are intentionally held in one process. Keep this
        # release single-replica while live location sharing is enabled.
        replicaCount: 1
        locationSharing:
          enabled: true
        auth:
          initialAdmin:
            existingSecret: mungchilog-initial-admin
        # One Ingress owns this host: do not configure publicPaths, which
        # would create a conflicting second same-host Ingress for static
        # assets.
        ingress:
          # Homer discovers only Ingresses selected by this standard label.
          labels:
            app.kubernetes.io/name: mungchilog
          annotations:
            cert-manager.io/cluster-issuer: nginx-letsencrypt-prod
            # Discovered by Homer's Dashboard CR via ingressSelector
            # (matchExpressions: app.kubernetes.io/name in [...]).
            item.homer.rajsingh.info/name: "Mungchilog"
            item.homer.rajsingh.info/subtitle: "Personal travel itinerary"
            item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/jyje/mungchilog/main/apps/web/public/pwa-512.png"
            item.homer.rajsingh.info/tag: "mungchilog #travel #maps #itinerary"
            # The application entrypoint is protected by OIDC. Do not use it
            # as Homer's unauthenticated Ping probe, which would report the
            # expected login redirect as offline.
            service.homer.rajsingh.info/name: "1. Applications"
            service.homer.rajsingh.info/icon: "fas fa-rocket"
          host: mungchilog.app.jyje.online
          tlsSecretName: mungchilog.app.jyje.online
        persistence:
          storageClassName: subdir-usb
        extraEnvFrom:
          - configMapRef:
              name: mungchilog-oidc-config
          - secretRef:
              name: mungchilog-server-key
          - secretRef:
              name: mungchilog-server-oidc
        extraResources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mungchilog-oidc-config
            data:
              OIDC_ISSUER_URL: https://authentik.app.jyje.online/application/o/mungchilog/
              OIDC_CLIENT_ID: mungchilog
              OIDC_REDIRECT_URI: https://mungchilog.app.jyje.online/auth/callback
          # Authentik client secret encrypted for the mungchilog-prd
          # namespace. Re-sealed from the existing mungchilog-server-oidc
          # secret via kubectl+kubeseal without the agent ever reading the
          # plaintext, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-oidc
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: mungchilog-server-oidc
                  namespace: mungchilog-prd
                type: Opaque
          # Google Maps Routes/Places server key. Re-sealed for
          # mungchilog-prd the same way as above.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
                NAVITIME_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog-prd
                type: Opaque
          # Initial admin bootstrap account. Re-sealed for mungchilog-prd
          # the same way as above.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-initial-admin
            spec:
              encryptedData:
                INITIAL_ADMIN_EMAIL: 
              template:
                metadata:
                  name: mungchilog-initial-admin
                  namespace: mungchilog-prd
                type: Opaque
          # Image Updater for the new deployment, tracking the same image
          # repository as mungchilog-legacy. Applied here (destination
          # namespace: argocd) rather than to this Application's own
          # namespace, since ImageUpdater is an argocd-scoped CRD, not an
          # app-namespace resource.
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: mungchilog-prd
              namespace: argocd
            spec:
              applicationRefs:
                - namePattern: mungchilog-prd
                  writeBackConfig:
                    method: argocd
                  images:
                    - alias: mungchilog
                      imageName: ghcr.io/jyje/mungchilog:managed
                      commonUpdateSettings:
                        updateStrategy: newest-build
                        allowTags: "regexp:^(?:[0-9]+-[0-9a-f]{7}|v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)-r[0-9]+-[0-9a-f]{7})$"
                        forceUpdate: true
                        platforms:
                          - linux/arm64
                      manifestTargets:
                        helm:
                          name: image.repository
                          tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog-prd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
