# Higress is the web entry of the cluster: the ingress controller for every
# public host, and the owner of ports 80 and 443 through its own LoadBalancer
# address. It replaced ingress-nginx, which is removed (issues #314, #326). Games and
# any UDP stay on Envoy Gateway, because Higress has no UDP listener.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/higress/higress-2.2.6
    helm:
      valuesObject:
        global:
          # Only Ingresses with this class are watched. Every public Ingress
          # in the cluster uses it.
          ingressClass: higress
          # Write the gateway address into the status of the Ingresses, so
          # Argo CD sees them as Healthy.
          enableStatus: true
          # Gateway API stays with Envoy Gateway. The UDP check showed Higress
          # has no UDP listener, so there is nothing to test here (see #314).
          enableGatewayAPI: false
          # The Higress controller hands Istio resources to the gateway only
          # when this is on. EnvoyFilter is the one used here (error pages).
          # No other Istio resource exists in the cluster.
          enableIstioAPI: true
        higress-core:
          controller:
            replicas: 1
            # Higress would request its own certificates over HTTP-01 and
            # needs port 80. cert-manager owns certificates here.
            automaticHttps:
              enabled: false
            # The chart default asks for 2Gi. These are starting values for
            # the Raspberry Pi nodes. Measure and adjust (see #314).
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
            # Go binary, so a Pi 4 node is fine and has the most free memory.
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: app.jyje.online/raspi.type
                          operator: In
                          values: ["4b"]
          pilot:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
          # Connections with no data for this many seconds are closed. The
          # default of 180 cuts long waits and idle WebSockets, and the
          # per-route higress.io/timeout cannot raise it. 3600 matches the
          # proxy-read-timeout the real Ingresses set on ingress-nginx.
          downstream:
            idleTimeout: 3600
          gateway:
            # One gateway pod on each worker node (the control plane node is
            # left out), so losing a node does not take the web entry down.
            replicas: 3
            # One pod per node is required, so a rollout cannot start a new pod
            # before an old one leaves its node. With the default surge of 100%
            # and no allowed unavailable pod, the new pods waited for nodes
            # that the old pods held, and the rollout stuck in Pending.
            rollingMaxSurge: 0
            rollingMaxUnavailable: 1
            # Entry point on a dedicated MetalLB address. The pool is created
            # outside this repository, in the environment's private
            # configuration, and holds one reserved LAN address that is not a
            # node address (a pool that overlaps node addresses caused an ARP
            # conflict before). The address is never written here.
            service:
              type: LoadBalancer
              # Local keeps the real client address. With the default
              # (Cluster) kube-proxy rewrites the source to a node address, so
              # every app saw the same address and logs, rate limits and
              # sign-in checks lost the client. MetalLB then announces the
              # address only from a node that runs a ready gateway pod.
              externalTrafficPolicy: Local
              annotations:
                metallb.io/address-pool: web-private
                metallb.universe.tf/address-pool: web-private
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 768Mi
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app: higress-gateway
        # The web console is not used.
        higress-console:
          replicaCount: 0
        extraResources:
          # Error pages through Higress (#326). ingress-nginx replaced backend
          # errors with the themed pages of the error-pages service. Envoy has
          # a custom response filter that can do the same: on a given response
          # status it sends the request again, inside the gateway, to another
          # route and returns that answer with the original status. The
          # filter is off by default and is switched on per host below. The
          # Gameplane host and the error pages host are left out on purpose:
          # Gameplane reads 401 and 404 itself, and the error pages host would
          # redirect to itself. Requests with a body keep the original answer.
          - apiVersion: networking.istio.io/v1alpha3
            kind: EnvoyFilter
            metadata:
              name: higress-error-pages
              namespace: "{{ .Release.Namespace }}"
            spec:
              workloadSelector:
                labels:
                  app: higress-gateway
                  higress: higress-system-higress-gateway
              configPatches:
                - applyTo: HTTP_FILTER
                  match:
                    context: GATEWAY
                    listener:
                      portNumber: 443
                      filterChain:
                        filter:
                          name: envoy.filters.network.http_connection_manager
                          subFilter:
                            name: envoy.filters.http.custom_response
                  patch:
                    # The Higress chart already inserts this filter with an empty
                    # config (higress-gateway-global-custom-response). Istio does
                    # not insert a second filter of the same name, so this merges
                    # into the existing one and switches it off by default.
                    operation: MERGE
                    value:
                      disabled: true
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      # The route configurations of this gateway are named
                      # per host, so match by name and not by port.
                      name: "higress-rds-443.t-errpages.higress.invalid"
                      vhost:
                        name: "t-errpages.higress.invalid:443"
                  patch:
                    operation: MERGE
                    value: &errorPagesValue
                      typed_per_filter_config:
                        envoy.filters.http.custom_response:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.custom_response.v3.CustomResponse
                          custom_response_matcher:
                            matcher_list:
                              matchers:
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "401"
                                on_match:
                                  action:
                                    name: error-page-401
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/401.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "403"
                                on_match:
                                  action:
                                    name: error-page-403
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/403.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "404"
                                on_match:
                                  action:
                                    name: error-page-404
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/404.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "405"
                                on_match:
                                  action:
                                    name: error-page-405
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/405.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "408"
                                on_match:
                                  action:
                                    name: error-page-408
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/408.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "409"
                                on_match:
                                  action:
                                    name: error-page-409
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/409.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "410"
                                on_match:
                                  action:
                                    name: error-page-410
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/410.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "429"
                                on_match:
                                  action:
                                    name: error-page-429
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/429.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "500"
                                on_match:
                                  action:
                                    name: error-page-500
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/500.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "502"
                                on_match:
                                  action:
                                    name: error-page-502
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/502.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "503"
                                on_match:
                                  action:
                                    name: error-page-503
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/503.html"
                              - predicate:
                                  single_predicate:
                                    input:
                                      name: status
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.type.matcher.v3.HttpResponseStatusCodeMatchInput
                                    value_match:
                                      exact: "504"
                                on_match:
                                  action:
                                    name: error-page-504
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.http.custom_response.redirect_policy.v3.RedirectPolicy
                                      uri: "https://error.app.jyje.online/504.html"
          # Test backend and a TLS host for the proof of concept. The host does
          # not resolve, so it is reachable only through the gateway address
          # with a resolve override.
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.cd.app.jyje.online"
                      vhost:
                        name: "cd.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.authentik.app.jyje.online"
                      vhost:
                        name: "authentik.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.hermes-henry.app.jyje.online"
                      vhost:
                        name: "hermes-henry.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.app.jyje.online"
                      vhost:
                        name: "app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.mungchilog.dev.jyje.online"
                      vhost:
                        name: "mungchilog.dev.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.mungchilog.stg.jyje.online"
                      vhost:
                        name: "mungchilog.stg.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.mungchilog.app.jyje.online"
                      vhost:
                        name: "mungchilog.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.n8n.app.jyje.online"
                      vhost:
                        name: "n8n.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.grafana.app.jyje.online"
                      vhost:
                        name: "grafana.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.litellm.app.jyje.online"
                      vhost:
                        name: "litellm.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.llm.app.jyje.online"
                      vhost:
                        name: "llm.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.attendee.dev.jyje.online"
                      vhost:
                        name: "attendee.dev.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.attendee.stg.jyje.online"
                      vhost:
                        name: "attendee.stg.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.attendee.app.jyje.online"
                      vhost:
                        name: "attendee.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
                - applyTo: VIRTUAL_HOST
                  match:
                    context: GATEWAY
                    routeConfiguration:
                      name: "higress-rds-443.portainer.app.jyje.online"
                      vhost:
                        name: "portainer.app.jyje.online:443"
                  patch:
                    operation: MERGE
                    value: *errorPagesValue
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: httpbin
              namespace: "{{ .Release.Namespace }}"
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: httpbin
              template:
                metadata:
                  labels:
                    app: httpbin
                spec:
                  containers:
                    - name: httpbin
                      image: mccutchen/go-httpbin:v2.15.0
                      ports:
                        - containerPort: 8080
                      resources:
                        requests:
                          cpu: 5m
                          memory: 16Mi
                        limits:
                          memory: 64Mi
          - apiVersion: v1
            kind: Service
            metadata:
              name: httpbin
              namespace: "{{ .Release.Namespace }}"
            spec:
              selector:
                app: httpbin
              ports:
                - port: 80
                  targetPort: 8080
          - apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: selfsigned
              namespace: "{{ .Release.Namespace }}"
            spec:
              selfSigned: {}
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: t-errpages
              namespace: "{{ .Release.Namespace }}"
            spec:
              secretName: t-errpages
              dnsNames:
                - t-errpages.higress.invalid
              issuerRef:
                kind: Issuer
                name: selfsigned
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-errpages
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/ssl-redirect: "true"
            spec:
              ingressClassName: higress
              tls:
                - secretName: t-errpages
                  hosts:
                    - t-errpages.higress.invalid
              rules:
                - host: t-errpages.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
  destination:
    server: https://kubernetes.default.svc
    namespace: higress-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
