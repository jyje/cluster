# Evaluation install of Higress (tracking issue #314). It runs next to
# ingress-nginx and Envoy Gateway and does not touch their Ingresses: it only
# watches Ingress objects with ingressClassName "higress", and nothing outside
# the test objects below uses that class. There is no automated sync, so
# nothing is deployed until someone syncs it. Remove this Application after
# the evaluation if Higress is not adopted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/higress/higress-2.2.6
    helm:
      valuesObject:
        global:
          # Only Ingresses with this class are watched. ingress-nginx keeps
          # serving every other Ingress.
          ingressClass: higress
          # Do not write the gateway address into Ingress status fields.
          enableStatus: false
          # Gateway API is on only to test whether Higress can route UDP
          # (UDPRoute is still alpha). It reconciles only GatewayClass
          # "higress", so Envoy Gateway is not affected.
          enableGatewayAPI: true
          enableAlphaGatewayAPI: true
          enableIstioAPI: false
        higress-core:
          controller:
            replicas: 1
            # Higress would request its own certificates over HTTP-01 and
            # needs port 80. cert-manager owns certificates here.
            automaticHttps:
              enabled: false
            # The chart default asks for 2Gi. These are starting values for
            # the Raspberry Pi nodes. Measure and adjust (see #314).
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
            # Go binary, so a Pi 4 node is fine and has the most free memory.
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: app.jyje.online/raspi.type
                          operator: In
                          values: ["4b"]
          pilot:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
          # Connections with no data for this many seconds are closed. The
          # default of 180 cuts long waits and idle WebSockets, and the
          # per-route higress.io/timeout cannot raise it. 3600 matches the
          # proxy-read-timeout the real Ingresses set on ingress-nginx.
          downstream:
            idleTimeout: 3600
          gateway:
            replicas: 1
            # Entry point on a dedicated MetalLB address. The pool is created
            # outside this repository, in the environment's private
            # configuration, and holds one reserved LAN address that is not a
            # node address (a pool that overlaps node addresses caused an ARP
            # conflict before). The address is never written here. ingress-nginx
            # keeps the node ports, so both run side by side.
            service:
              type: LoadBalancer
              annotations:
                metallb.io/address-pool: web-private
                metallb.universe.tf/address-pool: web-private
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 768Mi
            # The gateway is Envoy based. Envoy's TCMalloc cannot map its heap
            # on the 39-bit address space of the 4 KB page (Raspberry Pi 4)
            # nodes, so keep it on the other nodes.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: app.jyje.online/raspi.type
                          operator: NotIn
                          values: ["4b"]
        # The web console is not needed for the evaluation.
        higress-console:
          replicaCount: 0
        extraResources:
          # Test backend and an Ingress that carries nginx annotations, to
          # compare Higress with ingress-nginx. It uses a host that is not
          # resolvable, so it is only reachable through a port-forward.
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: echo
              namespace: "{{ .Release.Namespace }}"
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: echo
              template:
                metadata:
                  labels:
                    app: echo
                spec:
                  containers:
                    - name: echo
                      image: hashicorp/http-echo:1.0
                      args: ["-text=echo", "-listen=:5678"]
                      ports:
                        - containerPort: 5678
                      resources:
                        requests:
                          cpu: 5m
                          memory: 16Mi
                        limits:
                          memory: 32Mi
          - apiVersion: v1
            kind: Service
            metadata:
              name: echo
              namespace: "{{ .Release.Namespace }}"
            spec:
              selector:
                app: echo
              ports:
                - port: 80
                  targetPort: 5678
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: echo
              namespace: "{{ .Release.Namespace }}"
              annotations:
                # The same kinds of nginx annotations the real Ingresses use.
                nginx.ingress.kubernetes.io/enable-cors: "true"
                nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.jyje.online"
                nginx.ingress.kubernetes.io/cors-allow-methods: "GET, HEAD, OPTIONS"
                nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
                nginx.ingress.kubernetes.io/affinity: "cookie"
                nginx.ingress.kubernetes.io/session-cookie-name: "echo-affinity"
            spec:
              ingressClassName: higress
              rules:
                - host: echo.higress.invalid
                  http:
                    paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: echo
                            port:
                              number: 80
          # Annotation tests (#314). whoami prints its pod name, so session
          # affinity can be seen, and "?wait=5s" delays the answer, so timeouts
          # can be seen. Each Ingress has its own unresolvable host, reachable
          # only through a port-forward.
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: whoami
              namespace: "{{ .Release.Namespace }}"
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: whoami
              template:
                metadata:
                  labels:
                    app: whoami
                spec:
                  containers:
                    - name: whoami
                      image: traefik/whoami:v1.10.4
                      ports:
                        - containerPort: 80
                      resources:
                        requests:
                          cpu: 5m
                          memory: 16Mi
                        limits:
                          memory: 64Mi
          - apiVersion: v1
            kind: Service
            metadata:
              name: whoami
              namespace: "{{ .Release.Namespace }}"
            spec:
              selector:
                app: whoami
              ports:
                - port: 80
                  targetPort: 80
          # Several allowed origins and credentials, the case the
          # configuration-snippet origin echo covers on ingress-nginx.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-cors
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/enable-cors: "true"
                nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.jyje.online, https://other.example.test"
                nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
            spec:
              ingressClassName: higress
              rules:
                - host: t-cors.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # Cookie affinity across two pods.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-affinity
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/affinity: "cookie"
                nginx.ingress.kubernetes.io/session-cookie-name: "t-affinity"
                nginx.ingress.kubernetes.io/session-cookie-max-age: "600"
            spec:
              ingressClassName: higress
              rules:
                - host: t-affinity.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # The nginx timeout annotations, and the Higress one for comparison.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-timeout-nginx
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3"
            spec:
              ingressClassName: higress
              rules:
                - host: t-timeout-nginx.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-timeout-higress
              namespace: "{{ .Release.Namespace }}"
              annotations:
                higress.io/timeout: "3"
            spec:
              ingressClassName: higress
              rules:
                - host: t-timeout-higress.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # Request body limit.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-body
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/proxy-body-size: "1m"
            spec:
              ingressClassName: higress
              rules:
                - host: t-body.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # Rate and connection limits.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-rate
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/limit-rps: "2"
                nginx.ingress.kubernetes.io/limit-connections: "5"
            spec:
              ingressClassName: higress
              rules:
                - host: t-rate.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # Long-connection comparison (scripts/ingress-compat). The same
          # backends are exposed through ingress-nginx and Higress, each with
          # no timeout annotation and with a 3600 second one, to see which
          # defaults cut a long request or an idle WebSocket. The hosts do not
          # resolve, so they are reachable only through a port-forward.
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: httpbin
              namespace: "{{ .Release.Namespace }}"
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: httpbin
              template:
                metadata:
                  labels:
                    app: httpbin
                spec:
                  containers:
                    - name: httpbin
                      image: mccutchen/go-httpbin:v2.15.0
                      env:
                        # Allow responses that last minutes (default is 10s).
                        - name: MAX_DURATION
                          value: "5m"
                      ports:
                        - containerPort: 8080
                      resources:
                        requests:
                          cpu: 5m
                          memory: 16Mi
                        limits:
                          memory: 64Mi
          - apiVersion: v1
            kind: Service
            metadata:
              name: httpbin
              namespace: "{{ .Release.Namespace }}"
            spec:
              selector:
                app: httpbin
              ports:
                - port: 80
                  targetPort: 8080
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-nginx-default
              namespace: "{{ .Release.Namespace }}"
            spec:
              ingressClassName: nginx
              rules:
                - host: nginx-default.compat.invalid
                  http:
                    paths:
                      - {path: /echo, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-nginx-3600
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
            spec:
              ingressClassName: nginx
              rules:
                - host: nginx-3600.compat.invalid
                  http:
                    paths:
                      - {path: /echo, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-higress-default
              namespace: "{{ .Release.Namespace }}"
            spec:
              ingressClassName: higress
              rules:
                - host: higress-default.compat.invalid
                  http:
                    paths:
                      - {path: /echo, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-higress-nginx-names
              namespace: "{{ .Release.Namespace }}"
              annotations:
                nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
            spec:
              ingressClassName: higress
              rules:
                - host: higress-nginx-names.compat.invalid
                  http:
                    paths:
                      - {path: /echo, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-higress-3600
              namespace: "{{ .Release.Namespace }}"
              annotations:
                higress.io/timeout: "3600"
            spec:
              ingressClassName: higress
              rules:
                - host: higress-3600.compat.invalid
                  http:
                    paths:
                      - {path: /echo, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
                      - {path: /, pathType: Prefix, backend: {service: {name: httpbin, port: {number: 80}}}}
          # TLS and certificate checks (#314, step 2). A self-signed
          # certificate proves that port 443 serves a Higress Ingress with TLS.
          - apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: selfsigned
              namespace: "{{ .Release.Namespace }}"
            spec:
              selfSigned: {}
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: c-tls
              namespace: "{{ .Release.Namespace }}"
            spec:
              secretName: c-tls
              dnsNames:
                - tls.compat.invalid
              issuerRef:
                kind: Issuer
                name: selfsigned
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: c-tls
              namespace: "{{ .Release.Namespace }}"
            spec:
              ingressClassName: higress
              tls:
                - secretName: c-tls
                  hosts:
                    - tls.compat.invalid
              rules:
                - host: tls.compat.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # Rate limit with the Higress annotation name. The nginx names
          # (limit-rps) were ignored, so this checks the native one.
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: t-rate-higress
              namespace: "{{ .Release.Namespace }}"
              annotations:
                higress.io/route-limit-rps: "2"
            spec:
              ingressClassName: higress
              rules:
                - host: t-rate-higress.higress.invalid
                  http:
                    paths:
                      - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {number: 80}}}}
          # UDP check: does Higress accept a UDP listener and a UDPRoute?
          # Only the status of these objects matters, nothing is exposed.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: udp-check
              namespace: "{{ .Release.Namespace }}"
            spec:
              gatewayClassName: higress
              listeners:
                - name: udp
                  port: 34198
                  protocol: UDP
                  allowedRoutes:
                    kinds:
                      - kind: UDPRoute
          - apiVersion: gateway.networking.k8s.io/v1
            kind: UDPRoute
            metadata:
              name: udp-check
              namespace: "{{ .Release.Namespace }}"
            spec:
              parentRefs:
                - name: udp-check
              rules:
                - backendRefs:
                    - name: whoami
                      port: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: higress-system
  # No automated sync on purpose: sync by hand while the evaluation runs.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
