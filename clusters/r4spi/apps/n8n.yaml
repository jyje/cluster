apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/n8n-io/n8n-1.19.0
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        # Keep the release identity of the 8gears chart. The PVC, ConfigMap and
        # ServiceAccount stay named "n8n". The official chart adds a "-main"
        # suffix to the Deployment, Service and Ingress on its own.
        fullnameOverride: n8n
        # Single instance on SQLite, like the 8gears release. The official
        # chart defaults to queue mode with PostgreSQL and Redis.
        queueMode:
          enabled: false
        database:
          type: sqlite
          useExternal: false
        # With existingSecret the chart reads N8N_ENCRYPTION_KEY, N8N_HOST,
        # N8N_PORT and N8N_PROTOCOL from this Secret, not from values. The key
        # already lives in the n8n data volume: copy that same value into the
        # Secret before the first sync, or saved credentials stop decrypting.
        # See docs/operations/n8n-official-chart.md.
        secretRefs:
          existingSecret: n8n-encryption
        # The first start runs database migrations (2.6.2 to 2.47.4) and took
        # three to four minutes on a fast laptop. The chart default allows 300 s.
        # Allow 15 minutes so the kubelet does not restart it mid-migration.
        # Needs the local chart patch listed in helm/n8n-io/n8n-1.19.0/PATCH.md.
        probes:
          startup:
            failureThreshold: 90
        # One writer on a RWO volume: stop the old pod before the new one starts.
        strategy:
          type: Recreate
        # No image.tag on purpose: the chart's appVersion (2.47.4) is used.
        # The 8gears release pinned 2.6.2, so n8n runs its data migrations on
        # the first start. Back up the volume first.
        ingress:
          enabled: true
          className: higress
          annotations:
            cert-manager.io/cluster-issuer: higress-letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
            nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.jyje.online"
            nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
            nginx.ingress.kubernetes.io/cors-allow-headers: X-Api-Key
            nginx.ingress.kubernetes.io/cors-allow-methods: HEAD
            nginx.ingress.kubernetes.io/enable-cors: "true"
            # Discovered by Homer's Dashboard CR via ingressSelector
            # (matchLabels: app.kubernetes.io/name=n8n, the chart's own standard
            # label — the chart has no values field to add a custom label).
            item.homer.rajsingh.info/name: "n8n"
            item.homer.rajsingh.info/subtitle: "Workflow automation"
            item.homer.rajsingh.info/logo: "https://avatars.githubusercontent.com/u/45487711"
            item.homer.rajsingh.info/tag: "n8n #workflow #automation #cicd"
            item.homer.rajsingh.info/type: "Ping"
            service.homer.rajsingh.info/name: "1. Applications"
            service.homer.rajsingh.info/icon: "fas fa-rocket"
          hosts:
            - host: n8n.app.jyje.online
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: n8n.app.jyje.online
              hosts:
                - n8n.app.jyje.online
        persistence:
          enabled: true
          storageClassName: subdir-usb
          accessModes:
            - ReadWriteOnce
          size: 10Gi
  destination:
    namespace: n8n
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync on purpose. Merging this change must not start the cutover.
    # Sync by hand after the backup, with pruning off. Turn automation back on
    # once the rollout is verified.
