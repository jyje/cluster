apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent-henry
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/hermes-agent/hermes-agent-1.6.0
    helm:
      valuesObject:
        fullnameOverride: hermes-agent-henry
        config:
          # Register the in-cluster LiteLLM proxy as a custom OpenAI-compatible
          # provider, then point the model at its NVIDIA NIM-backed GLM-5.2
          # entry (see clusters/r4spi/apps/litellm.yaml's nvidia_nim models).
          providers:
            litellm:
              base_url: http://litellm.ollama-system.svc.cluster.local:4000/v1
              key_env: OPENAI_API_KEY
              discover_models: true
          model:
            provider: litellm
            default: z-ai/glm-5.2
          terminal:
            backend: local
        nodeSelector:
          app.jyje.online/raspi.type: 5b
        extraEnvFrom:
          - secretRef:
              name: hermes-agent-henry-creds
        extraResources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: hermes-agent-henry-creds
            spec:
              encryptedData:
                OPENAI_API_KEY: 
                TELEGRAM_ALLOWED_USERS: 
                TELEGRAM_BOT_TOKEN: 
                TELEGRAM_HOME_CHANNEL: 
              template:
                metadata:
                  name: hermes-agent-henry-creds
                  namespace: hermes-agent-henry
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-agent-henry
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
