apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent-henry
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/hermes-agent/hermes-agent-1.6.0
    helm:
      valuesObject:
        fullnameOverride: hermes-agent-henry
        config:
          # Register the in-cluster LiteLLM proxy as a custom OpenAI-compatible
          # provider, then point the model at one of its NVIDIA NIM-backed
          # entries (see clusters/r4spi/apps/litellm.yaml's nvidia_nim models).
          providers:
            litellm:
              base_url: http://litellm.ollama-system.svc.cluster.local:4000/v1
              key_env: OPENAI_API_KEY
              discover_models: true
          model:
            provider: litellm
            # Temporary: z-ai/glm-5.2 was hitting NVIDIA NIM's own 429
            # rate limit (confirmed via litellm logs, not a config issue).
            # Switch back once that clears up.
            default: nvidia/nemotron-3.5-lightning-30b-a3b
            # discover_models only calls the generic /v1/models list (names
            # only, no context field) — Hermes never sees litellm's own
            # /v1/model/info, so it can't learn the real window on its own
            # and falls back to a 131,072 default. Declare it explicitly
            # here instead; verified against the model's real NIM-enforced
            # limit (see clusters/r4spi/apps/litellm.yaml's model_info for
            # this model). Hot-reloads without a pod restart per Hermes'
            # docs (config.yaml > model.context_length).
            context_length: 1000000
          terminal:
            backend: local
        nodeSelector:
          app.jyje.online/raspi.type: 5b
        extraEnvFrom:
          - secretRef:
              name: hermes-agent-henry-creds
        extraResources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: hermes-agent-henry-creds
            spec:
              encryptedData:
                OPENAI_API_KEY: 
                TELEGRAM_ALLOWED_USERS: 
                TELEGRAM_BOT_TOKEN: 
                TELEGRAM_HOME_CHANNEL: 
              template:
                metadata:
                  name: hermes-agent-henry-creds
                  namespace: hermes-agent-henry
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-agent-henry
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
