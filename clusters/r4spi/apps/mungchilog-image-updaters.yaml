apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mungchilog
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: mungchilog-prd
      writeBackConfig:
        method: argocd
      images:
        - alias: mungchilog
          imageName: ghcr.io/jyje/mungchilog:managed
          commonUpdateSettings:
            # Existing numeric tags are accepted during the migration. New
            # production deployment tags are traced semantic releases. The
            # shorter vMAJOR.MINOR.PATCH alias is intentionally not selected.
            updateStrategy: newest-build
            allowTags: "regexp:^(?:[0-9]+-[0-9a-f]{7}|v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)-r[0-9]+-[0-9a-f]{7})$"
            forceUpdate: true
            platforms:
              - linux/arm64
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
---
