apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog-dev
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/mungchilog.git
    targetRevision: dev
    path: charts/mungchilog
    helm:
      valuesObject:
        image:
          # Image Updater replaces this sentinel after a dev build publishes
          # the first immutable dev image.
          tag: managed
        # Coordinates are intentionally held in one process. Keep this
        # release single-replica while live location sharing is enabled.
        replicaCount: 1
        locationSharing:
          enabled: true
        ingress:
          labels:
            app.kubernetes.io/name: mungchilog
          annotations:
            cert-manager.io/cluster-issuer: nginx-letsencrypt-prod
          host: mungchilog.dev.jyje.online
          tlsSecretName: mungchilog.dev.jyje.online
        persistence:
          storageClassName: subdir-usb
        auth:
          initialAdmin:
            existingSecret: mungchilog-initial-admin
        extraEnvFrom:
          - configMapRef:
              name: mungchilog-oidc-config
          - secretRef:
              name: mungchilog-server-key
          - secretRef:
              name: mungchilog-server-oidc
        extraResources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mungchilog-oidc-config
            data:
              OIDC_ISSUER_URL: https://authentik.app.jyje.online/application/o/mungchilog/
              OIDC_CLIENT_ID: mungchilog
              OIDC_REDIRECT_URI: https://mungchilog.dev.jyje.online/auth/callback
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-oidc
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: mungchilog-server-oidc
                  namespace: mungchilog-dev
                type: Opaque
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog-dev
                type: Opaque
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-initial-admin
            spec:
              encryptedData:
                INITIAL_ADMIN_EMAIL: 
              template:
                metadata:
                  name: mungchilog-initial-admin
                  namespace: mungchilog-dev
                type: Opaque
          # Image Updater owns the running image tag Helm parameter above.
          # Applied here (destination namespace: argocd) rather than to this
          # Application's own namespace, since ImageUpdater is an
          # argocd-scoped CRD, not an app-namespace resource.
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: mungchilog-dev
              namespace: argocd
            spec:
              applicationRefs:
                - namePattern: mungchilog-dev
                  writeBackConfig:
                    method: argocd
                  images:
                    - alias: mungchilog
                      imageName: ghcr.io/jyje/mungchilog-dev:managed
                      commonUpdateSettings:
                        updateStrategy: newest-build
                        allowTags: "regexp:^r[0-9]+-[0-9a-f]{7}$"
                        forceUpdate: true
                        platforms:
                          - linux/arm64
                      manifestTargets:
                        helm:
                          name: image.repository
                          tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
