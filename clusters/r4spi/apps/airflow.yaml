apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/airflow/airflow-1.22.0
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        # The chart defaults to Airflow 3.2.2 and CeleryExecutor. Pin what the
        # pilot (pilot-airflow-portability) needs. Tracking issue: #407.
        airflowVersion: "3.4.0"
        defaultAirflowTag: "3.4.0"
        executor: KubernetesExecutor
        # One task, one Pod. No Redis, no Celery workers, no Flower, no statsd.
        # The triggerer is off until a DAG needs deferrable operators.
        redis:
          enabled: false
        statsd:
          enabled: false
        triggerer:
          enabled: false
        # The metadata database is the CloudNativePG cluster of the airflow-pg
        # Application, not the bundled PostgreSQL subchart.
        postgresql:
          enabled: false
        data:
          metadataSecretName: airflow-metadata
        fernetKeySecretName: airflow-fernet
        apiSecretKeySecretName: airflow-api-secret
        jwtSecretName: airflow-jwt
        config:
          api:
            base_url: https://airflow.app.jyje.online
            # Fewer API workers keep the memory small on a Raspberry Pi.
            workers: "1"
          core:
            load_examples: "False"
        # The chart jobs use Helm hooks. Argo CD does not run those, so they
        # are Argo CD sync hooks that delete themselves after they succeed.
        migrateDatabaseJob:
          useHelmHooks: false
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: HookSucceeded
        createUserJob:
          useHelmHooks: false
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: HookSucceeded
          defaultUser:
            username: admin
            email: admin@example.invalid
            firstName: admin
            lastName: user
          # The password comes from the Secret airflow-admin, not from values.
          env:
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: password
          args:
            - bash
            - -c
            - |-
              exec airflow users create "$@"
            - --
            - -r
            - Admin
            - -u
            - admin
            - -e
            - admin@example.invalid
            - -f
            - admin
            - -l
            - user
            - -p
            - $(AIRFLOW_ADMIN_PASSWORD)
        # DAGs come from the public pilot repository, read only.
        dags:
          gitSync:
            enabled: true
            repo: https://github.com/jyje/pilot-airflow-portability.git
            branch: main
            ref: main
            subPath: src/dags
            period: 60s
        # Task Pods are short lived, so the API server reads task logs from a
        # shared volume.
        logs:
          persistence:
            enabled: true
            size: 2Gi
            storageClassName: subdir-usb
        ingress:
          apiServer:
            enabled: true
            ingressClassName: higress
            annotations:
              cert-manager.io/cluster-issuer: higress-letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              # The limit is per route, not per client. It slows down password
              # guessing on the token endpoint.
              higress.io/route-limit-rps: "20"
              item.homer.rajsingh.info/name: "Airflow"
              item.homer.rajsingh.info/subtitle: "Workflow scheduler"
              item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/apache/airflow-site/main/landing-pages/site/static/images/airflow-logo.svg"
              item.homer.rajsingh.info/tag: "airflow #workflow #dag"
              item.homer.rajsingh.info/type: "Ping"
              service.homer.rajsingh.info/name: "1. Applications"
              service.homer.rajsingh.info/icon: "fas fa-rocket"
            hosts:
              - name: airflow.app.jyje.online
                tls:
                  enabled: true
                  secretName: airflow.app.jyje.online
        # Small requests: the nodes are already fairly full. Measure after the
        # first run and tune.
        apiServer:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
        scheduler:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
        dagProcessor:
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        workers:
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        extraResources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-metadata
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                connection: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-fernet
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                fernet-key: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-api-secret
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                api-secret-key: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-jwt
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                jwt-secret: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-admin
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                password: 
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
