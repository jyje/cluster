apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
spec:
  project: ai
  sources:
  - repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/airflow/airflow-1.22.0
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        # The chart defaults to Airflow 3.2.2 and CeleryExecutor. Pin what the
        # pilot (pilot-airflow-portability) needs. Tracking issue: #407.
        airflowVersion: "3.4.0"
        defaultAirflowTag: "3.4.0"
        executor: KubernetesExecutor
        # One task, one Pod. No Redis, no Celery workers, no Flower, no statsd.
        # The triggerer is off until a DAG needs deferrable operators.
        redis:
          enabled: false
        statsd:
          enabled: false
        triggerer:
          enabled: false
        # The metadata database is the CloudNativePG cluster of the airflow-pg
        # Application, not the bundled PostgreSQL subchart.
        postgresql:
          enabled: false
        data:
          metadataSecretName: airflow-metadata
        fernetKeySecretName: airflow-fernet
        apiSecretKeySecretName: airflow-api-secret
        jwtSecretName: airflow-jwt
        config:
          api:
            base_url: https://airflow.app.jyje.online
            # Fewer API workers keep the memory small on a Raspberry Pi.
            workers: "1"
          core:
            load_examples: "False"
          dag_processor:
            dag_bundle_config_list: '[{"name":"dags-folder","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{}},
              {"name":"pilot-e03","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/airflow/pilot-profile/dags"}}]'
            dag_importer_configs: '[{"classpath":"airflow.sdk.importers.yaml_importer.YamlDagImporter"}]'
          sdk:
            coordinators: '{"pilot-node":{"classpath":"airflow.sdk.coordinators.node.NodeCoordinator","kwargs":{"node_executable":"/opt/airflow/pilot-profile/runtime/node"}},
              "pilot-go":{"classpath":"airflow.sdk.coordinators.executable.ExecutableCoordinator"}, "pilot-java":{"classpath":"airflow.sdk.coordinators.java.JavaCoordinator","kwargs":{"java_executable":"/opt/airflow/pilot-profile/runtime/openjdk/bin/java"}}}'
            queue_to_coordinator: '{"typescript":"pilot-node","golang":"pilot-go","jvm":"pilot-java"}'
        # The chart jobs use Helm hooks. Argo CD does not run those, so they
        # are Argo CD sync hooks that delete themselves after they succeed.
        migrateDatabaseJob:
          useHelmHooks: false
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: HookSucceeded
        createUserJob:
          useHelmHooks: false
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
            argocd.argoproj.io/hook-delete-policy: HookSucceeded
          defaultUser:
            username: admin
            email: admin@example.invalid
            firstName: admin
            lastName: user
          # The password comes from the Secret airflow-admin, not from values.
          env:
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: password
          args:
            - bash
            - -c
            - |-
              exec airflow users create "$@"
            - --
            - -r
            - Admin
            - -u
            - admin
            - -e
            - admin@example.invalid
            - -f
            - admin
            - -l
            - user
            - -p
            - $(AIRFLOW_ADMIN_PASSWORD)
        # DAGs come from the public pilot repository, read only.
        dags:
          gitSync:
            enabled: true
            repo: https://github.com/jyje/pilot-airflow-portability.git
            branch: main
            ref: main
            subPath: src/dags
            period: 60s
        # Task Pods are short lived, so the API server reads task logs from a
        # shared volume.
        logs:
          persistence:
            enabled: true
            size: 2Gi
            storageClassName: subdir-usb
        ingress:
          apiServer:
            enabled: true
            ingressClassName: higress
            annotations:
              cert-manager.io/cluster-issuer: higress-letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              # The limit is per route, not per client. It slows down password
              # guessing on the token endpoint.
              higress.io/route-limit-rps: "20"
              # The Homer card pings the health endpoint from the browser, so the
              # dashboard origin must be allowed (same as the other cards).
              nginx.ingress.kubernetes.io/enable-cors: "true"
              nginx.ingress.kubernetes.io/cors-allow-origin: https://app.jyje.online
              item.homer.rajsingh.info/name: "Airflow"
              item.homer.rajsingh.info/subtitle: "Workflow scheduler"
              item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/apache/airflow-site/main/landing-pages/site/static/images/airflow-logo.svg"
              item.homer.rajsingh.info/tag: "airflow #workflow #dag"
              item.homer.rajsingh.info/type: "Ping"
              service.homer.rajsingh.info/name: "1. Applications"
              service.homer.rajsingh.info/icon: "fas fa-rocket"
            hosts:
              - name: airflow.app.jyje.online
                tls:
                  enabled: true
                  secretName: airflow.app.jyje.online
        # Requests follow the measured use of each component, not a guess.
        apiServer:
          # The API server needs more than the default 60 seconds to start on
          # these nodes, because it syncs the role permissions into the
          # database first. Give the startup probe 5 minutes, so the Pod is
          # not killed halfway.
          startupProbe:
            failureThreshold: 30
          # Sign-in through authentik. The client secret is read from the
          # Secret airflow-oidc. FAB maps the authentik groups in the ID token
          # to Airflow roles, so nobody is named here.
          apiServerConfig: |
            import os

            from flask_appbuilder.const import AUTH_OAUTH

            AUTH_TYPE = AUTH_OAUTH
            OAUTH_PROVIDERS = [
                {
                    "name": "authentik",
                    "icon": "fa-key",
                    "token_key": "access_token",
                    "remote_app": {
                        "client_id": "airflow",
                        "client_secret": os.environ["AUTHENTIK_CLIENT_SECRET"],
                        "server_metadata_url": "https://authentik.app.jyje.online/application/o/airflow/.well-known/openid-configuration",
                        "api_base_url": "https://authentik.app.jyje.online/application/o/",
                        "client_kwargs": {"scope": "openid profile email"},
                    },
                }
            ]
            AUTH_USER_REGISTRATION = True
            AUTH_USER_REGISTRATION_ROLE = "Public"
            AUTH_ROLES_SYNC_AT_LOGIN = True
            AUTH_ROLES_MAPPING = {
                "AuthentikAdmin": ["Admin"],
                "ClusterAdmin": ["Admin"],
            }
          env:
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: airflow-oidc
                  key: client_secret
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 1Gi
        scheduler:
          resources:
            requests:
              cpu: 100m
              memory: 448Mi
            limits:
              memory: 1Gi
        dagProcessor:
          extraVolumes:
          - name: pilot-e03-dags
            configMap:
              name: pilot-e03-dags
          extraVolumeMounts:
          - name: logs
            mountPath: /opt/airflow/pilot-profile
            subPath: .pilot-mixed-profile-20261124
            readOnly: true
          - name: pilot-e03-dags
            mountPath: /opt/airflow/pilot-profile/dags/reconcile.py
            subPath: reconcile.py
            readOnly: true
          - name: pilot-e03-dags
            mountPath: /opt/airflow/pilot-profile/dags/chain.yaml
            subPath: chain.yaml
            readOnly: true
          - name: pilot-e03-dags
            mountPath: /opt/airflow/pilot-profile/dags/settlement.min.mjs
            subPath: settlement.min.mjs
            readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 768Mi
        workers:
          kubernetes:
            extraVolumes:
            - name: pilot-e03-dags
              configMap:
                name: pilot-e03-dags
            extraVolumeMounts:
            - name: logs
              mountPath: /opt/airflow/pilot-profile
              subPath: .pilot-mixed-profile-20261124
              readOnly: true
            - name: pilot-e03-dags
              mountPath: /opt/airflow/pilot-profile/dags/reconcile.py
              subPath: reconcile.py
              readOnly: true
            - name: pilot-e03-dags
              mountPath: /opt/airflow/pilot-profile/dags/chain.yaml
              subPath: chain.yaml
              readOnly: true
            - name: pilot-e03-dags
              mountPath: /opt/airflow/pilot-profile/dags/settlement.min.mjs
              subPath: settlement.min.mjs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        extraResources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-metadata
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                connection: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-fernet
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                fernet-key: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-api-secret
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                api-secret-key: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-jwt
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                jwt-secret: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-admin
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                password: 
          # OAuth client secret for authentik sign-in.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-oidc
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                client_secret: 
          # Password of the limited pilot API user (see docs/operations/airflow.md).
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-pilot
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                password: 
  - repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: manifests/airflow/pilot-e03
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
