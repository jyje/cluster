---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/cert-manager/cert-manager-v1.21.3
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        crds:
          enabled: true
          keep: true
        # Upstream extraObjects takes each object as a templated YAML string.
        extraObjects:
          - |
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: higress-letsencrypt-stag
            spec:
              acme:
                email: jyjeon@outlook.com
                server: https://acme-staging-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: higress-letsencrypt-stag
                solvers:
                  - http01:
                      ingress:
                        ingressClassName: higress
          - |
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: higress-letsencrypt-prod
            spec:
              acme:
                email: jyjeon@outlook.com
                server: https://acme-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: higress-letsencrypt-prod
                solvers:
                  - http01:
                      ingress:
                        ingressClassName: higress
  destination:
    namespace: kube-system
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
