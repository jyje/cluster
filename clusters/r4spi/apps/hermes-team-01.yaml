apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/hermes-agent/hermes-agent-1.6.0
    helm:
      valuesObject:
        fullnameOverride: hermes-agent
        config:
          model:
            provider: openai-codex
            default: gpt-5.6-terra
          terminal:
            backend: local
        # OpenAI Codex device-code login (v1.3.0+): the auth init container
        # sends a verification URL + code to Discord, waits for approval,
        # and persists the refreshable credential in $HERMES_HOME/auth.json
        # — survives restarts on this agent's own private PVC. Not sealed;
        # obtained interactively at runtime.
        auth:
          deviceFlow:
            enabled: true
            provider: openai-codex
            notify: discord
        env:
          # Unused by openai-codex; overrides the chart's OpenAI-key
          # placeholder default so nothing looks half-configured.
          OPENAI_API_KEY: "unused"
        nodeSelector:
          app.jyje.online/raspi.type: 5b
        team:
          enabled: true
          name: hermes-team-01
          role: leader
          identity: hermes-agent
          leader:
            name: hermes-agent
            mentionEnv: HERMES_AGENT_BOT_USER_ID
          members:
            - name: hermes-june
              role: Research and evidence gathering
              mentionEnv: HERMES_JUNE_BOT_USER_ID
              capabilities: [research, source-review]
            - name: hermes-july
              role: Implementation and verification
              mentionEnv: HERMES_JULY_BOT_USER_ID
              capabilities: [implementation, testing]
          protocol:
            maxHandoffs: 6
          skill:
            create: true
            configMapName: hermes-team-01-skill
          sharedVolume:
            create: true
            claimName: hermes-knowledge-base
            mountPath: /knowledge
            storageClass: subdir-usb
            accessModes: [ReadWriteMany]
            size: 10Gi
            retain: true
        extraEnvFrom:
          - secretRef:
              name: hermes-agent-creds
          - secretRef:
              name: hermes-team-routing
        extraResources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: hermes-agent-creds
            spec:
              encryptedData:
                DISCORD_ALLOWED_USERS: 
                DISCORD_BOT_TOKEN: 
                DISCORD_HOME_CHANNEL: 
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: hermes-team-routing
            spec:
              encryptedData:
                HERMES_AGENT_BOT_USER_ID: 
                HERMES_JULY_BOT_USER_ID: 
                HERMES_JUNE_BOT_USER_ID: 
              template:
                metadata:
                  name: hermes-team-routing
                  namespace: hermes-team-01
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-team-01
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hermes-agents
  namespace: argocd
spec:
  # Followers only — hermes-agent (leader, owns the shared knowledge-base
  # PVC) is the standalone Application above. NOTE on templating: ArgoCD's
  # goTemplate only substitutes STRING leaf values ("per-field, string
  # only" per the ApplicationSet docs) — it cannot conditionally
  # include/exclude whole YAML keys, which is exactly why the PVC couldn't
  # be owned by "just one" generated element and had to move to a
  # hand-written Application instead.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: hermes-june
            model: gpt-5.6-terra
            secretName: hermes-june-creds
            encryptedData:
              DISCORD_ALLOWED_USERS: 
              DISCORD_BOT_TOKEN: 
              DISCORD_HOME_CHANNEL: 

          - name: hermes-july
            model: gpt-5.6-terra
            secretName: hermes-july-creds
            encryptedData:
              DISCORD_ALLOWED_USERS: 
              DISCORD_BOT_TOKEN: 
              DISCORD_HOME_CHANNEL: 
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: ai
      source:
        repoURL: https://github.com/jyje/cluster
        targetRevision: main
        path: helm/hermes-agent/hermes-agent-1.6.0
        helm:
          valuesObject:
            fullnameOverride: "{{.name}}"
            config:
              model:
                provider: openai-codex
                default: "{{.model}}"
              terminal:
                backend: local
            auth:
              deviceFlow:
                enabled: true
                provider: openai-codex
                notify: discord
            env:
              OPENAI_API_KEY: "unused"
            nodeSelector:
              app.jyje.online/raspi.type: 5b
            team:
              enabled: true
              name: hermes-team-01
              role: member
              identity: "{{.name}}"
              leader:
                name: hermes-agent
                mentionEnv: HERMES_AGENT_BOT_USER_ID
              members:
                - name: hermes-june
                  role: Research and evidence gathering
                  mentionEnv: HERMES_JUNE_BOT_USER_ID
                  capabilities: [research, source-review]
                - name: hermes-july
                  role: Implementation and verification
                  mentionEnv: HERMES_JULY_BOT_USER_ID
                  capabilities: [implementation, testing]
              protocol:
                maxHandoffs: 6
              skill:
                create: false
                configMapName: hermes-team-01-skill
              sharedVolume:
                create: false
                claimName: hermes-knowledge-base
                mountPath: /knowledge
            extraEnvFrom:
              - secretRef:
                  name: "{{.secretName}}"
              - secretRef:
                  name: hermes-team-routing
            extraResources:
              - apiVersion: bitnami.com/v1alpha1
                kind: SealedSecret
                metadata:
                  name: "{{.secretName}}"
                spec:
                  encryptedData:
                    DISCORD_ALLOWED_USERS: "{{.encryptedData.DISCORD_ALLOWED_USERS}}"
                    DISCORD_BOT_TOKEN: "{{.encryptedData.DISCORD_BOT_TOKEN}}"
                    DISCORD_HOME_CHANNEL: "{{.encryptedData.DISCORD_HOME_CHANNEL}}"
                  template:
                    metadata:
                      name: "{{.secretName}}"
                    type: Opaque
      destination:
        server: https://kubernetes.default.svc
        namespace: hermes-team-01
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
