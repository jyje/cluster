---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/cnpg/cloudnative-pg-0.29.1
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        replicaCount: 2
        config:
          data:
            INHERITED_ANNOTATIONS: "reflector.v1.k8s.emberstack.com/reflection-allowed"
            # An operator upgrade rolls every PostgreSQL instance. By default all
            # clusters roll at once. All database data sits on one NFS-backed USB
            # drive, so spread the restarts: wait between clusters and between the
            # instances of one cluster.
            CLUSTERS_ROLLOUT_DELAY: "120"
            INSTANCES_ROLLOUT_DELAY: "30"
  destination:
    namespace: cnpg-system
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated: {}
