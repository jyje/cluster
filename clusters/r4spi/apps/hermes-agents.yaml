apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hermes-agents
  namespace: argocd
spec:
  # NOTE on templating: ArgoCD's goTemplate only substitutes STRING leaf
  # values ("per-field, string only" per the ApplicationSet docs) — it
  # cannot conditionally include/exclude whole YAML keys (e.g. {{if}}
  # wrapping a block). So every generated Application below has the SAME
  # structure; only leaf string values (name, model, hint text, ciphertext)
  # differ per element. This is what let all three move to openai-codex
  # device-flow auth uniformly instead of the previous mixed litellm/copilot
  # setup, which genuinely couldn't share one template.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: hermes-agent
            model: gpt-5.6-terra
            environmentHint: |
              You are "hermes-agent", a Hermes agent living in this Discord
              server as part of the hermes-team-01 team.
            secretName: hermes-agent-creds
            encryptedData:
              DISCORD_ALLOWED_USERS: 
              DISCORD_BOT_TOKEN: 
              DISCORD_HOME_CHANNEL: 

          - name: hermes-june
            model: gpt-5.6-terra
            environmentHint: |
              You are "hermes-june", one of the collaborating Hermes agents
              living in this Discord server. Your partner agent is
              "hermes-july", whose Discord user ID is 1520304612316286986. To
              hand the conversation to hermes-july, put an explicit
              <@1520304612316286986> mention in the BODY of your message.
              Only mention hermes-july when you have something substantive to
              say or genuinely need their input. When a topic reaches a
              natural conclusion, do NOT mention hermes-july at all — address
              the human instead and end your turn — so the exchange stops.
              Never send a filler, acknowledgement, or "let me know if you
              need anything" message that mentions hermes-july; that only
              restarts the loop.
            secretName: hermes-june-creds
            encryptedData:
              DISCORD_ALLOWED_USERS: 
              DISCORD_BOT_TOKEN: 
              DISCORD_HOME_CHANNEL: 

          - name: hermes-july
            model: gpt-5.6-terra
            environmentHint: |
              You are "hermes-july", one of the collaborating Hermes agents
              living in this Discord server. Your partner agent is
              "hermes-june", whose Discord user ID is 1520295553768882246. To
              hand the conversation to hermes-june, put an explicit
              <@1520295553768882246> mention in the BODY of your message.
              Only mention hermes-june when you have something substantive to
              say or genuinely need their input. When a topic reaches a
              natural conclusion, do NOT mention hermes-june at all — address
              the human instead and end your turn — so the exchange stops.
              Never send a filler, acknowledgement, or "let me know if you
              need anything" message that mentions hermes-june; that only
              restarts the loop.
            secretName: hermes-july-creds
            encryptedData:
              DISCORD_ALLOWED_USERS: 
              DISCORD_BOT_TOKEN: 
              DISCORD_HOME_CHANNEL: 
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: ai
      source:
        # Same exception as the individual Applications this replaces:
        # consume the versioned OCI release directly rather than a vendored
        # chart copy.
        repoURL: oci://ghcr.io/jyje/hermes-agent-helm/hermes-agent
        targetRevision: 1.3.0
        path: .
        helm:
          valuesObject:
            fullnameOverride: "{{.name}}"
            # replicaCount: 0 is not possible — the chart's values.schema.json
            # enforces a minimum of 1 (filed as jyje/hermes-agent-helm#150).
            # So this deploys at replica 1 immediately; each Pod crash-loops
            # on the openai-codex device-login step until it's completed via
            # the Discord-delivered verification code.
            config:
              model:
                provider: openai-codex
                default: "{{.model}}"
              terminal:
                backend: local
              agent:
                # Injected into the system prompt as agent.environment_hint.
                environment_hint: |
                  {{.environmentHint}}
            # OpenAI Codex device-code login (v1.3.0+): the auth init
            # container sends a verification URL + code to Discord, waits for
            # approval, and persists the refreshable credential in
            # $HERMES_HOME/auth.json — survives restarts on the agent's own
            # private PVC. Not sealed; obtained interactively at runtime.
            auth:
              deviceFlow:
                enabled: true
                provider: openai-codex
                notify: discord
            env:
              # Unused by openai-codex; overrides the chart's OpenAI-key
              # placeholder default so nothing looks half-configured.
              OPENAI_API_KEY: "unused"
            nodeSelector:
              app.jyje.online/raspi.type: 5b
            # Multi-agent collaboration knobs, kept uniform across the whole
            # roster (harmless for an instance no one currently mentions).
            # DISCORD_ALLOW_BOTS must be a real env var: the Discord adapter
            # reads os.getenv("DISCORD_ALLOW_BOTS") directly, not bridged
            # from config.yaml's discord: block. "mentions" = respond to
            # another bot only when it @mentions us. DISCORD_REPLY_TO_MODE=off
            # + ALLOW_MENTION_REPLIED_USER=false is the loop brake: without
            # it, a reply-reference itself counts as a mention and two bots
            # ping-pong forever.
            extraEnv:
              - name: DISCORD_ALLOW_BOTS
                value: "mentions"
              - name: DISCORD_THREAD_REQUIRE_MENTION
                value: "true"
              - name: DISCORD_REPLY_TO_MODE
                value: "off"
              - name: DISCORD_ALLOW_MENTION_REPLIED_USER
                value: "false"
            # Shared, concurrently-writable knowledge base, independent of
            # this agent's own private HERMES_HOME PVC (persistence, chart
            # default).
            extraVolumes:
              - name: knowledge-base
                persistentVolumeClaim:
                  claimName: hermes-knowledge-base
            extraVolumeMounts:
              - name: knowledge-base
                mountPath: /knowledge
            extraEnvFrom:
              - secretRef:
                  name: "{{.secretName}}"
            extraResources:
              - apiVersion: bitnami.com/v1alpha1
                kind: SealedSecret
                metadata:
                  name: "{{.secretName}}"
                spec:
                  encryptedData:
                    DISCORD_ALLOWED_USERS: "{{.encryptedData.DISCORD_ALLOWED_USERS}}"
                    DISCORD_BOT_TOKEN: "{{.encryptedData.DISCORD_BOT_TOKEN}}"
                    DISCORD_HOME_CHANNEL: "{{.encryptedData.DISCORD_HOME_CHANNEL}}"
                  template:
                    metadata:
                      name: "{{.secretName}}"
                    type: Opaque
              # ArgoCD's goTemplate can't conditionally include one list item
              # for only some generator elements (it only substitutes STRING
              # leaf values, not structure) — so this PVC is declared
              # identically by all three Applications rather than by just
              # one. It's an idempotent apply (same content every time), so
              # this is safe, but expect ArgoCD's UI to flag it as a "shared
              # resource" on whichever Application isn't first to reconcile
              # it — cosmetic, not a sync failure.
              - apiVersion: v1
                kind: PersistentVolumeClaim
                metadata:
                  name: hermes-knowledge-base
                spec:
                  accessModes:
                    - ReadWriteMany
                  storageClassName: subdir-usb
                  resources:
                    requests:
                      storage: 10Gi
      destination:
        server: https://kubernetes.default.svc
        namespace: hermes-team-01
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
