# Sealed secret and Image Updater are declared in extraResources (same pattern as mungchilog).
# The chart renders them; keep image.tag as the managed sentinel for Image Updater.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-attendee-prd
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/open-attendee.git
    targetRevision: prd
    path: helm
    helm:
      valuesObject:
        image:
          repository: ghcr.io/jyje/open-attendee
          tag: managed
        replicaCount: 1
        existingSecret: open-attendee
        persistence:
          storageClass: subdir-usb
        ingress:
          enabled: true
          clusterIssuer: nginx-letsencrypt-prod
          host: attendee.app.jyje.online
        extraResources:
        - apiVersion: bitnami.com/v1alpha1
          kind: SealedSecret
          metadata:
            name: open-attendee
          spec:
            encryptedData:
              OPENAI_API_KEY: 
              OWNER_PASSWORD_HASH: 
              SESSION_SECRET: 
            template:
              metadata:
                name: open-attendee
                namespace: open-attendee-prd
        - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
          kind: ImageUpdater
          metadata:
            name: open-attendee-prd
            namespace: argocd
          spec:
            applicationRefs:
            - namePattern: open-attendee-prd
              writeBackConfig:
                method: argocd
              images:
              - alias: open-attendee
                imageName: ghcr.io/jyje/open-attendee:managed
                commonUpdateSettings:
                  updateStrategy: newest-build
                  allowTags: regexp:^r[0-9]+-[0-9a-f]{7}$
                  forceUpdate: true
                  platforms:
                  - linux/arm64
                manifestTargets:
                  helm:
                    name: image.repository
                    tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: open-attendee-prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
