apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factorio
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/factorio/factorio-12.1.4
    helm:
      valuesObject:
        image:
          tag: stable-2.1.24-rootless@sha256:31db38d8d5cb992c3c8672b10a67822c997d5face5df41d6fca6594f8181de7d
        securityContext:
          container:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          pod:
            fsGroup: 1000
        service:
          rcon:
            enabled: false
        persistence:
          config:
            existingClaim: factorio-data
          settings:
            enabled: true
            type: configmap
            objectName: settings
            mountPath: /etc/factorio
            readOnly: true
        configmap:
          settings:
            enabled: true
            data:
              overrides.json: |
                {
                  "name": "Factorio",
                  "visibility": {"public": false, "lan": false},
                  "require_user_verification": true,
                  "max_players": 4,
                  "auto_pause": true,
                  "autosave_interval": 5,
                  "autosave_slots": 3
                }
        workload:
          main:
            podSpec:
              automountServiceAccountToken: false
              nodeSelector:
                kubernetes.io/arch: arm64
              terminationGracePeriodSeconds: 120
              containers:
                main:
                  command: [/bin/sh, -ec]
                  args:
                    - |
                      mkdir -p /factorio/saves /factorio/mods
                      printf '[path]\nread-data=/opt/factorio/data\nwrite-data=/factorio\n' > /factorio/config.ini
                      factorio=/opt/factorio/bin/arm64/factorio
                      jq -s '.[0] * .[1]' /opt/factorio/data/server-settings.example.json \
                        /etc/factorio/overrides.json > /factorio/server-settings.json
                      if ! find /factorio/saves -maxdepth 1 -name '*.zip' ! -name '*.tmp.zip' | grep -q .; then
                        "$factorio" --config /factorio/config.ini --mod-directory /factorio/mods --create /factorio/saves/world.zip
                      fi
                      exec "$factorio" --config /factorio/config.ini --mod-directory /factorio/mods \
                        --start-server-load-latest --server-settings /factorio/server-settings.json --port 34197
                  probes:
                    startup:
                      type: exec
                      command: [/bin/sh, -ec, "grep -qi ':8595 ' /proc/net/udp /proc/net/udp6"]
                    readiness:
                      type: exec
                      command: [/bin/sh, -ec, "grep -qi ':8595 ' /proc/net/udp /proc/net/udp6"]
                    liveness:
                      enabled: false
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        extraResources:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: factorio-data
              namespace: '{{ .Release.Namespace }}'
              annotations:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
            spec:
              storageClassName: subdir-usb
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: factorio
  # Sync only after the live UDP echo gate has passed.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
