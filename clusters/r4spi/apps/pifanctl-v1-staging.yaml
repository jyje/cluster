apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pifanctl-v1-staging
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/pifanctl
    targetRevision: 083f50ed5865384f8238fe62d480344ff3bb5d66
    path: charts/pifanctl-operator
    helm:
      valuesObject:
        operatorId: pifanctl-v1-staging
        image:
          repository: ghcr.io/jyje/pifanctl
          # Stable Python 3.14 runtime (pifanctl 1.2.0). TLS verification stays enabled;
          # the cluster CA now carries Key Usage, see docs/operations/cluster-ca-key-usage.md.
          tag: v1.2.0
          pullPolicy: IfNotPresent
        agent:
          mode: managed
        networkPolicy:
          monitoringNamespaceSelector:
            kubernetes.io/metadata.name: observability
        serviceMonitor:
          enabled: true
          labels:
            release: prometheus
        # One shared fan on raspi-40 cools the complete four-node rack.
        # Keep the temperature curve aligned with the v0 cluster settings.
        extraResources:
          - apiVersion: pifanctl.jyje.online/v1
            kind: Fan
            metadata:
              name: r4spi-rack-fan
            spec:
              nodeName: raspi-40
              hardware:
                rpigpio:
                  pin: 18
                  frequencyHz: 1000
              # Observe the existing NF-A12x25 PWM driven from Pi 5 V power.
              # Gray extension wire carries tach to BCM23 (physical pin 16).
              # Internal 3.3 V bias was explicitly authorized and measured.
              # RPM is observational; it does not change the thermal curve.
              feedback:
                tachometer:
                  gpio:
                    pin: 23
                    pull: up
                  pulsesPerRevolution: 2
                  sampleSeconds: 5
              control:
                curve:
                  temperatureLow: 50
                  temperatureHigh: 75
                  dutyIdle: 0
                  dutyStart: 30
                  dutyMax: 100
                  dutyDownStep: 5
                  temperatureHysteresis: 5
                refreshIntervalSeconds: 5
                failsafeDuty: 100
                exitDuty: 100
          - apiVersion: pifanctl.jyje.online/v1
            kind: CoolingZone
            metadata:
              name: r4spi-rack
            spec:
              nodeNames:
                - raspi-40
                - raspi-41
                - raspi-50
                - raspi-51
              fanRefs:
                - r4spi-rack-fan
              telemetry:
                source: prometheus
                prometheusURL: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
                maxSampleAgeSeconds: 30
  destination:
    namespace: pifanctl
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=background
      - PruneLast=true
