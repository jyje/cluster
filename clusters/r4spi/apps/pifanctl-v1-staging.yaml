apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pifanctl-v1-staging
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/pifanctl
    targetRevision: 69a829f2bb17977b692954c905129498d63abcf7
    path: charts/pifanctl-operator
    helm:
      valuesObject:
        operatorId: pifanctl-v1-staging
        image:
          repository: ghcr.io/jyje/pifanctl-issue
          tag: 69a829f-py312
          pullPolicy: IfNotPresent
        agent:
          mode: reuse
        networkPolicy:
          monitoringNamespaceSelector:
            kubernetes.io/metadata.name: observability
        serviceMonitor:
          enabled: false
        # One shared fan on raspi-40 cools the complete four-node rack.
        # Keep the temperature curve aligned with the v0 cluster settings.
        extraResources:
          - apiVersion: pifanctl.jyje.online/v1alpha1
            kind: Fan
            metadata:
              name: r4spi-rack-fan
            spec:
              nodeName: raspi-40
              hardware:
                rpigpio:
                  pin: 18
                  frequencyHz: 1000
              control:
                curve:
                  temperatureLow: 50
                  temperatureHigh: 75
                  dutyIdle: 0
                  dutyStart: 30
                  dutyMax: 100
                  dutyDownStep: 5
                  temperatureHysteresis: 5
                refreshIntervalSeconds: 5
                failsafeDuty: 100
                exitDuty: 100
          - apiVersion: pifanctl.jyje.online/v1alpha1
            kind: CoolingZone
            metadata:
              name: r4spi-rack
            spec:
              nodeNames:
                - raspi-40
                - raspi-41
                - raspi-50
                - raspi-51
              fanRefs:
                - r4spi-rack-fan
              telemetry:
                source: prometheus
                prometheusURL: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
                maxSampleAgeSeconds: 30
  destination:
    namespace: pifanctl
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
