apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pifanctl-v1-staging
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/pifanctl
    targetRevision: c08ac28158b00e9d2cc25a863b6a3b937785c98d
    path: charts/pifanctl-operator
    helm:
      valuesObject:
        operatorId: pifanctl-v1-staging
        image:
          repository: ghcr.io/jyje/pifanctl
          # Immutable stable runtime variant for the existing legacy cluster CA.
          # Keep TLS verification enabled; canonical Python 3.14 requires CA modernization.
          tag: v1.1.0-py312
          pullPolicy: IfNotPresent
        agent:
          mode: managed
        networkPolicy:
          monitoringNamespaceSelector:
            kubernetes.io/metadata.name: observability
        serviceMonitor:
          enabled: true
          labels:
            release: prometheus
        # One shared fan on raspi-40 cools the complete four-node rack.
        # Keep the temperature curve aligned with the v0 cluster settings.
        extraResources:
          - apiVersion: pifanctl.jyje.online/v1
            kind: Fan
            metadata:
              name: r4spi-rack-fan
            spec:
              nodeName: raspi-40
              hardware:
                rpigpio:
                  pin: 18
                  frequencyHz: 1000
              control:
                curve:
                  temperatureLow: 50
                  temperatureHigh: 75
                  dutyIdle: 0
                  dutyStart: 30
                  dutyMax: 100
                  dutyDownStep: 5
                  temperatureHysteresis: 5
                refreshIntervalSeconds: 5
                failsafeDuty: 100
                exitDuty: 100
          - apiVersion: pifanctl.jyje.online/v1
            kind: CoolingZone
            metadata:
              name: r4spi-rack
            spec:
              nodeNames:
                - raspi-40
                - raspi-41
                - raspi-50
                - raspi-51
              fanRefs:
                - r4spi-rack-fan
              telemetry:
                source: prometheus
                prometheusURL: http://prometheus-kube-prometheus-prometheus.observability.svc:9090
                maxSampleAgeSeconds: 30
  destination:
    namespace: pifanctl
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=background
      - PruneLast=true
