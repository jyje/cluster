apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pifanctl-v1-staging
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/pifanctl
    targetRevision: 69a829f2bb17977b692954c905129498d63abcf7
    path: charts/pifanctl-operator
    helm:
      valuesObject:
        operatorId: pifanctl-v1-staging
        image:
          repository: ghcr.io/jyje/pifanctl-issue
          tag: 69a829f-py312
          pullPolicy: IfNotPresent
        agent:
          mode: reuse
        networkPolicy:
          monitoringNamespaceSelector:
            kubernetes.io/metadata.name: observability
        serviceMonitor:
          enabled: false
        # Stage 1: run the operator beside the v0 application. Add Fan and
        # CoolingZone resources only after the v0 controller has stopped.
        extraResources: []
  destination:
    namespace: pifanctl
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
