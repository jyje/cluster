apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Keep the Application identity so the existing game Gateway stays tracked.
  name: envoy-udp-poc
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: manifests/envoy-gateways
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: {}
    syncOptions:
      - FailOnSharedResource=true
