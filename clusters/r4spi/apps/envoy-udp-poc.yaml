apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-udp-poc
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: manifests/envoy-udp-poc
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  # Sync only after the controller is ready. Do not configure WAN forwarding.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
