apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-pg
spec:
  project: ai
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/jyje/manifest-group-0.1.0
    helm:
      valuesObject:
        manifests:
          # Credentials of the database owner. The same password is inside the
          # airflow-metadata connection string of the airflow Application.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: airflow-pg-creds
              namespace: "{{ .Release.Namespace }}"
            spec:
              encryptedData:
                password: 
                username: 
              template:
                type: kubernetes.io/basic-auth
                metadata:
                  name: airflow-pg-creds
          # CloudNativePG PostgreSQL cluster for the Airflow metadata database.
          - apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: airflow-pg
              namespace: "{{ .Release.Namespace }}"
            spec:
              instances: 2
              imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
              storage:
                size: 2Gi
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              bootstrap:
                initdb:
                  database: airflow
                  owner: airflow
                  secret:
                    name: airflow-pg-creds
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      cnpg.io/cluster: airflow-pg
              failoverDelay: 30
              # Same values as litellm-pg: the CNPG defaults cause false
              # failovers on short network blips and a too small WAL window.
              postgresql:
                parameters:
                  wal_sender_timeout: 60s
                  wal_receiver_timeout: 60s
                  wal_keep_size: 2048MB
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
