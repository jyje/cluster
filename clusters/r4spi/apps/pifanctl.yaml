apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pifanctl
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/pifanctl/pifanctl-0.2.0-alpha.2
    helm:
      valuesObject:
        # Where controllers ask for the hottest node. Agents on every node
        # publish pifanctl_temperature_celsius, so the fan follows the maximum
        # of the whole cluster instead of only its own board.
        prometheus:
          url: http://prometheus-kube-prometheus-prometheus.observability.svc:9090

        # The fan is wired to a single node. Selecting it by hostname keeps
        # the placement declared here instead of in a hand-applied node label.
        # Add a group (with its own nodeSelector and driver) for another fan.
        controllers:
          default:
            # Stage 2 of the v1 handoff: stop the sole legacy GPIO18 writer.
            # Keep the temperature agents running for the v1 operator.
            enabled: false
            nodeSelector:
              kubernetes.io/hostname: raspi-40
            # Linear fan curve at the Raspberry Pi 5 official fan's end points:
            # off below 50 C, 30% at 50 C, 100% at 75 C, with a straight line
            # in between (duty = 30 + 2.8 * (T - 50)). The fan follows the
            # hottest node of the cluster. At today's load that is expected to
            # hold the hottest node near 51 C at about 34% duty, and a heavy
            # load below about 60 C, 20 C under the 80 C throttling point.
            # A 5 C temperature hysteresis (the chart default) keeps the fan
            # running until the node is 5 C below its peak, so it does not
            # switch on and off around 50 C.
            # These are estimates from a model fitted to this cluster; the
            # earlier 40 to 55 curve ran about 6 C cooler at about 19 points
            # more duty. Lower tempLow for cooler, raise it for quieter.
            curve:
              tempLow: 50
              tempHigh: 75

        monitoring:
          # Selected by the Prometheus in the observability namespace
          # (serviceMonitorSelector / ruleSelector: release=prometheus).
          serviceMonitor:
            enabled: true
            labels:
              release: prometheus
          prometheusRule:
            enabled: true
            labels:
              release: prometheus
          # grafana-operator only watches the observability namespace, so the
          # dashboard has to live there even though the release does not.
          grafanaDashboard:
            enabled: true
            mode: grafanaOperator
            namespace: observability
            folder: Hardware
            instanceSelector:
              matchLabels:
                dashboards: r4spi
  destination:
    namespace: pifanctl
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
