apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/mungchilog/mungchilog-0.1.0
    helm:
      valuesObject:
        image:
          # jyje/mungchilog@17563a2 (M0-M5, including M3/M4 client
          # wiring - LegInfo/OpeningHours components that render a
          # placeholder until GOOGLE_MAPS_SERVER_KEY exists, then need
          # no further code changes to go live). Supersedes 85667f7:
          # codex caught LegInfo omitting the itinerary day/time from
          # its route request (would've defaulted to "now" once a key
          # existed, wrong for any day but today).
          #
          # Staying pinned to a sha, not :latest - codex caught a second,
          # independent reason beyond the CI race this repo hit once:
          # imagePullPolicy is IfNotPresent, so once a node has cached
          # ghcr.io/jyje/mungchilog:latest, a Deployment spec that still
          # reads ":latest" is byte-for-byte unchanged after a new push.
          # Argo CD sees no diff and does nothing - :latest silently
          # stops deploying anything new. Bump this string on every
          # release; that's what actually gives Argo CD a diff to act on.
          tag: "17563a25028f90c7d41a602baad5f1639595a58b"
        extraEnvFrom:
          - secretRef:
              name: mungchilog-server-key
        extraResources:
          # Gate the whole app behind Basic Auth: this is a personal
          # travel itinerary (real names, dates, locations), not
          # something to leave reachable by anyone who guesses the
          # subdomain. Password was generated once and shared with jyje
          # out of band (not in this repo, not in chat history a bot
          # would index): rotate by re-sealing if it ever needs to
          # change.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-basic-auth
            spec:
              encryptedData:
                auth: 
              template:
                metadata:
                  name: mungchilog-basic-auth
                  namespace: mungchilog
                type: Opaque
          # Google Maps Routes/Places server key (never exposed
          # client-side). Value came from jyje's local .env, piped
          # straight through kubectl+kubeseal without the agent ever
          # printing or reading it, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
