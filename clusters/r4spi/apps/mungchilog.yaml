apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/mungchilog/mungchilog-0.1.0
    helm:
      valuesObject:
        image:
          # :managed is an existing mutable bootstrap tag published by the
          # Mungchilog build workflow. Image Updater immediately replaces it
          # with a permitted immutable 40-character Git SHA through an Argo CD
          # Helm parameter, so every deployed revision has a real spec diff.
          # The root apps Application preserves only that parameter to avoid a
          # self-heal race. No image update is written back to Git.
          tag: managed
        extraEnvFrom:
          - secretRef:
              name: mungchilog-server-key
        extraResources:
          # Gate the whole app behind Basic Auth: this is a personal
          # travel itinerary (real names, dates, locations), not
          # something to leave reachable by anyone who guesses the
          # subdomain. Password was generated once and shared with jyje
          # out of band (not in this repo, not in chat history a bot
          # would index): rotate by re-sealing if it ever needs to
          # change.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-basic-auth
            spec:
              encryptedData:
                auth: 
              template:
                metadata:
                  name: mungchilog-basic-auth
                  namespace: mungchilog
                type: Opaque
          # Google Maps Routes/Places server key (never exposed
          # client-side). Value came from jyje's local .env, piped
          # straight through kubectl+kubeseal without the agent ever
          # printing or reading it, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog
                type: Opaque
          # The Mungchilog chart owns its image update policy. The Argo CD
          # Application CR itself lives in argocd, so ImageUpdater must be
          # created there as well even though this Helm release targets the
          # mungchilog workload namespace.
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: mungchilog
              namespace: argocd
            spec:
              applicationRefs:
                - namePattern: mungchilog
                  # The API write-back changes only the live Application's
                  # Helm parameter. It never needs GitHub credentials.
                  writeBackConfig:
                    method: argocd
                  images:
                    - alias: mungchilog
                      imageName: ghcr.io/jyje/mungchilog:managed
                      commonUpdateSettings:
                        # GitHub Actions publishes immutable commit-SHA tags.
                        # Excluding managed ensures it can only bootstrap, not
                        # become a Deployment's long-lived mutable tag.
                        updateStrategy: newest-build
                        allowTags: "^[0-9a-f]{40}$"
                        forceUpdate: true
                        platforms:
                          - linux/arm64
                      manifestTargets:
                        helm:
                          name: image.repository
                          tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
