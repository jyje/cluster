apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Renamed from mungchilog-prd during the mungchilog -> mungchilog-prd
  # namespace migration. This Application keeps serving the current
  # mungchilog namespace under a non-colliding name until cutover; it will
  # be deleted once mungchilog-prd.yaml takes over the production host.
  name: mungchilog-legacy
spec:
  project: base
  source:
    # Application ownership and production-only overrides remain in this
    # repository. Production follows Mungchilog's protected prd branch.
    repoURL: https://github.com/jyje/mungchilog.git
    targetRevision: prd
    path: charts/mungchilog
    helm:
      valuesObject:
        image:
          # :managed intentionally does not exist in GHCR. Image Updater
          # immediately replaces it through an Argo CD Helm parameter with a
          # permitted immutable GitHub workflow-run and short-SHA tag, so every
          # deployed revision has a real spec diff.
          # The root apps Application preserves only that parameter to avoid a
          # self-heal race. No image update is written back to Git.
          # Seed the replacement Application with the image that is already
          # running. Image Updater subsequently owns this Helm parameter.
          tag: 38-6b00f49
        # Coordinates are intentionally held in one process. Keep this
        # release single-replica while live location sharing is enabled.
        replicaCount: 1
        locationSharing:
          enabled: true
        auth:
          initialAdmin:
            existingSecret: mungchilog-initial-admin
        # Upstream keeps safe, portable defaults. This production ingress is
        # cluster-owned because its hostname and TLS issuer are infrastructure
        # policy rather than chart defaults. One Ingress owns this host: do
        # not configure publicPaths, which would create a conflicting second
        # same-host Ingress for static assets.
        ingress:
          # Homer discovers only Ingresses selected by this standard label.
          labels:
            app.kubernetes.io/name: mungchilog
          annotations:
            cert-manager.io/cluster-issuer: nginx-letsencrypt-prod
            # Discovered by Homer's Dashboard CR via ingressSelector
            # (matchExpressions: app.kubernetes.io/name in [...]).
            item.homer.rajsingh.info/name: "Mungchilog"
            item.homer.rajsingh.info/subtitle: "Personal travel itinerary"
            item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/jyje/mungchilog/main/apps/web/public/pwa-512.png"
            item.homer.rajsingh.info/tag: "mungchilog #travel #maps #itinerary"
            # The application entrypoint is protected by OIDC. Do not use it
            # as Homer's unauthenticated Ping probe, which would report the
            # expected login redirect as offline.
            service.homer.rajsingh.info/name: "1. Applications"
            service.homer.rajsingh.info/icon: "fas fa-rocket"
          host: mungchilog.app.jyje.online
          tlsSecretName: mungchilog.app.jyje.online
        # Keep the current PVC's NFS storage class explicit. An empty value
        # would depend on a cluster-wide default and breaks fresh installs if
        # that default ever changes.
        persistence:
          storageClassName: subdir-usb
        extraEnvFrom:
          # Public provider settings are configuration, not credentials.
          # Keep them separate from the sealed client secret so rollout and
          # rotation are visible without ever exposing secret material.
          - configMapRef:
              name: mungchilog-oidc-config
          - secretRef:
              name: mungchilog-server-key
          - secretRef:
              name: mungchilog-server-oidc
        extraResources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mungchilog-oidc-config
            data:
              OIDC_ISSUER_URL: https://authentik.app.jyje.online/application/o/mungchilog/
              OIDC_CLIENT_ID: mungchilog
              OIDC_REDIRECT_URI: https://mungchilog.app.jyje.online/auth/callback
          # Authentik client secret encrypted for this namespace.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-oidc
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: mungchilog-server-oidc
                  namespace: mungchilog
                type: Opaque
          # Google Maps Routes/Places server key (never exposed
          # client-side). Value came from jyje's local .env, piped
          # straight through kubectl+kubeseal without the agent ever
          # printing or reading it, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog
                type: Opaque
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-initial-admin
            spec:
              encryptedData:
                INITIAL_ADMIN_EMAIL: 
              template:
                metadata:
                  name: mungchilog-initial-admin
                  namespace: mungchilog
          # Image Updater owns the running image tag Helm parameter above.
          # Applied here (destination namespace: argocd) rather than to this
          # Application's own namespace, since ImageUpdater is an
          # argocd-scoped CRD, not an app-namespace resource.
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: mungchilog
              namespace: argocd
            spec:
              applicationRefs:
                - namePattern: mungchilog-legacy
                  writeBackConfig:
                    method: argocd
                  images:
                    - alias: mungchilog
                      imageName: ghcr.io/jyje/mungchilog:managed
                      commonUpdateSettings:
                        # Existing numeric tags are accepted during the migration. New
                        # production deployment tags are traced semantic releases. The
                        # shorter vMAJOR.MINOR.PATCH alias is intentionally not selected.
                        updateStrategy: newest-build
                        allowTags: "regexp:^(?:[0-9]+-[0-9a-f]{7}|v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)-r[0-9]+-[0-9a-f]{7})$"
                        forceUpdate: true
                        platforms:
                          - linux/arm64
                      manifestTargets:
                        helm:
                          name: image.repository
                          tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
