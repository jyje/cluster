apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/mungchilog/mungchilog-0.1.0
    helm:
      valuesObject:
        image:
          # M0: pass-through deploy. jyje/mungchilog's build.yml pushes
          # ghcr.io/jyje/mungchilog:<sha> and :latest on every push to main;
          # bump this to a pinned sha once M1+ work starts landing.
          tag: latest
        extraResources:
          # Gate the whole app behind Basic Auth: this is a personal
          # travel itinerary (real names, dates, locations), not
          # something to leave reachable by anyone who guesses the
          # subdomain. Password was generated once and shared with jyje
          # out of band (not in this repo, not in chat history a bot
          # would index) — rotate by re-sealing if it ever needs to
          # change.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-basic-auth
            spec:
              encryptedData:
                auth: 
              template:
                metadata:
                  name: mungchilog-basic-auth
                  namespace: mungchilog
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
