apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: helm/mungchilog/mungchilog-0.1.0
    helm:
      valuesObject:
        image:
          # jyje/mungchilog@656d987: fixes outbound HTTPS from the pod,
          # which was failing for every external host (not just Google)
          # because Alpine's musl getaddrinfo() aborts a dual-stack
          # lookup entirely when this cluster's CoreDNS answers AAAA
          # with NXDOMAIN - the app now forces IPv4-only DNS for its
          # own outbound calls (dns.resolve4, not a CoreDNS change).
          # Also adds route polylines/arrows on the map.
          #
          # Staying pinned to a sha, not :latest - codex caught a second,
          # independent reason beyond the CI race this repo hit once:
          # imagePullPolicy is IfNotPresent, so once a node has cached
          # ghcr.io/jyje/mungchilog:latest, a Deployment spec that still
          # reads ":latest" is byte-for-byte unchanged after a new push.
          # Argo CD sees no diff and does nothing - :latest silently
          # stops deploying anything new. Bump this string on every
          # release; that's what actually gives Argo CD a diff to act on.
          tag: "656d987f30d8e7cf12bd4beb725474022bf28c71"
        extraEnvFrom:
          # Public OIDC settings are intentionally separate from the client
          # secret so the deployment spec never contains credential material.
          - configMapRef:
              name: mungchilog-oidc-config
          - secretRef:
              name: mungchilog-server-key
          # This Secret must be created as a SealedSecret before the image is
          # advanced to an OIDC-enabled release. It holds only
          # OIDC_CLIENT_SECRET and is never committed in plaintext.
          - secretRef:
              name: mungchilog-oidc
        extraResources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mungchilog-oidc-config
            data:
              OIDC_ISSUER_URL: https://authentik.app.jyje.online/application/o/mungchilog/
              OIDC_CLIENT_ID: mungchilog
              OIDC_REDIRECT_URI: https://mungchilog.app.jyje.online/auth/callback
              ADMIN_EMAIL: jyjeon@outlook.com
          # Generated through the Authentik API and immediately sealed with
          # the live sealed-secrets controller public certificate. The
          # plaintext client secret was never written to this repository.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-oidc
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: mungchilog-oidc
                  namespace: mungchilog
                type: Opaque
          # Gate the whole app behind Basic Auth: this is a personal
          # travel itinerary (real names, dates, locations), not
          # something to leave reachable by anyone who guesses the
          # subdomain. Password was generated once and shared with jyje
          # out of band (not in this repo, not in chat history a bot
          # would index): rotate by re-sealing if it ever needs to
          # change.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-basic-auth
            spec:
              encryptedData:
                auth: 
              template:
                metadata:
                  name: mungchilog-basic-auth
                  namespace: mungchilog
                type: Opaque
          # Google Maps Routes/Places server key (never exposed
          # client-side). Value came from jyje's local .env, piped
          # straight through kubectl+kubeseal without the agent ever
          # printing or reading it, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog
                type: Opaque
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
