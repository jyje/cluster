apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mungchilog
spec:
  project: base
  source:
    # Application ownership and production-only overrides remain in this
    # repository. The chart itself follows Mungchilog's main branch until a
    # release pinning policy is introduced.
    repoURL: https://github.com/jyje/mungchilog.git
    targetRevision: main
    path: charts/mungchilog
    helm:
      valuesObject:
        image:
          # :managed intentionally does not exist in GHCR. Image Updater
          # immediately replaces it through an Argo CD Helm parameter with a
          # permitted immutable GitHub workflow-run and short-SHA tag, so every
          # deployed revision has a real spec diff.
          # The root apps Application preserves only that parameter to avoid a
          # self-heal race. No image update is written back to Git.
          tag: managed
        # Upstream keeps safe, portable defaults. This production ingress is
        # cluster-owned because its hostname, TLS issuer, and public PWA
        # assets are infrastructure policy rather than chart defaults. OIDC
        # sessions now protect application requests, so no Basic Auth
        # annotation remains here.
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: nginx-letsencrypt-prod
          host: mungchilog.app.jyje.online
          tlsSecretName: mungchilog.app.jyje.online
          publicPaths:
            - path: /assets
              pathType: Prefix
            - path: /workbox-
              pathType: ImplementationSpecific
            - path: /sw.js
              pathType: Exact
            - path: /registerSW.js
              pathType: Exact
            - path: /manifest.webmanifest
              pathType: Exact
            - path: /favicon.svg
              pathType: Exact
            - path: /pwa-192.png
              pathType: Exact
            - path: /pwa-512.png
              pathType: Exact
        # Keep the current PVC's NFS storage class explicit. An empty value
        # would depend on a cluster-wide default and breaks fresh installs if
        # that default ever changes.
        persistence:
          storageClassName: subdir-usb
        extraEnvFrom:
          # Public provider settings are configuration, not credentials.
          # Keep them separate from the sealed client secret so rollout and
          # rotation are visible without ever exposing secret material.
          - configMapRef:
              name: mungchilog-oidc-config
          - secretRef:
              name: mungchilog-server-key
          - secretRef:
              name: mungchilog-server-oidc
        extraResources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: mungchilog-oidc-config
            data:
              OIDC_ISSUER_URL: https://authentik.app.jyje.online/application/o/mungchilog/
              OIDC_CLIENT_ID: mungchilog
              OIDC_REDIRECT_URI: https://mungchilog.app.jyje.online/auth/callback
              ADMIN_EMAIL: jyjeon@outlook.com
          # Authentik client secret encrypted for this namespace.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-oidc
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: mungchilog-server-oidc
                  namespace: mungchilog
                type: Opaque
          # Google Maps Routes/Places server key (never exposed
          # client-side). Value came from jyje's local .env, piped
          # straight through kubectl+kubeseal without the agent ever
          # printing or reading it, per jyje's explicit instruction.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: mungchilog-server-key
            spec:
              encryptedData:
                GOOGLE_MAPS_SERVER_API_KEY: 
              template:
                metadata:
                  name: mungchilog-server-key
                  namespace: mungchilog
                type: Opaque
          # The Mungchilog chart owns its image update policy. The Argo CD
          # Application CR itself lives in argocd, so ImageUpdater must be
          # created there as well even though this Helm release targets the
          # mungchilog workload namespace.
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: mungchilog
              namespace: argocd
            spec:
              applicationRefs:
                - namePattern: mungchilog
                  # The API write-back changes only the live Application's
                  # Helm parameter. It never needs GitHub credentials.
                  writeBackConfig:
                    method: argocd
                  images:
                    - alias: mungchilog
                      imageName: ghcr.io/jyje/mungchilog:managed
                      commonUpdateSettings:
                        # GitHub Actions publishes tags such as 22-a1b2c3d.
                        # The managed sentinel never matches this pattern.
                        updateStrategy: newest-build
                        allowTags: "regexp:^[0-9]+-[0-9a-f]{7}$"
                        forceUpdate: true
                        platforms:
                          - linux/arm64
                      manifestTargets:
                        helm:
                          name: image.repository
                          tag: image.tag
  destination:
    server: https://kubernetes.default.svc
    namespace: mungchilog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
