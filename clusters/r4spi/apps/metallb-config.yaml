# MetalLB 설정 디렉터리입니다. 주소 풀은 LAN 주소라서 저장소 밖(비공개 설정)에 두고, 이 디렉터리에는 설명만 둡니다.
# MetalLB 컨트롤러는 별도로 설치되어 있어야 합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: manifests/metallb-jyje-1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated: {}
