---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: base
  source:
    repoURL: https://github.com/jyje/cluster
    targetRevision: main
    path: clusters/r4spi/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Image Updater writes the selected immutable Mungchilog image as a Helm
  # parameter on each environment Application. This root app remains the
  # source of truth for every other child field, while preserving those
  # controller-owned parameters across automated self-heal syncs.
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    name: mungchilog-dev
    namespace: argocd
    jsonPointers:
    - /spec/source/helm/parameters
  - group: argoproj.io
    kind: Application
    name: mungchilog-stg
    namespace: argocd
    jsonPointers:
    - /spec/source/helm/parameters
  - group: argoproj.io
    kind: Application
    name: mungchilog-prd
    namespace: argocd
    jsonPointers:
    - /spec/source/helm/parameters
  syncPolicy:
    automated: {}
    syncOptions:
    - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: base
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    server: 'https://kubernetes.default.svc'
  sourceRepos:
  - '*'
