# Example: the authentik side of a Hermes dashboard sign-in.
#
# In this cluster the blueprint lives in clusters/r4spi/apps/authentik.yaml,
# as a ConfigMap under additionalObjects (the data key is the file below) and
# listed under blueprints.configMaps. It is shown here as a plain file so it
# can be read on its own.
#
# Hermes registers as a PUBLIC client with PKCE, so there is no client secret
# and nothing to seal. Replace "example" consistently with the Application in
# docs/operations/examples/hermes-dashboard-application.yaml.
version: 1
metadata:
  name: Hermes dashboard (example)
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: hermes-example-provider
    identifiers:
      name: Hermes example dashboard
    attrs:
      client_type: public
      # Must equal config.dashboard.oauth.self_hosted.client_id.
      client_id: hermes-example-dashboard
      # Required. A provider created from a blueprint allows no grant types by
      # default, and sign-in then fails with invalid_request ("The request is
      # otherwise malformed"). The authentik log says "Invalid grant_type for
      # provider".
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # A public client has no secret to sign with, so tokens need a key pair.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      redirect_uris:
        # The external origin of the Ingress host plus /auth/callback, exactly.
        - matching_mode: strict
          url: https://hermes-example.app.jyje.online/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  - model: authentik_core.application
    id: hermes-example-app
    identifiers:
      # The slug is the last path segment of the issuer in the Application.
      slug: hermes-example
    attrs:
      name: Hermes example
      provider: !KeyOf hermes-example-provider
      meta_launch_url: https://hermes-example.app.jyje.online

  # The dashboard shows API keys and gives shell level access to the pod.
  # authentik has no allowlist of its own here: whoever may use this
  # application may sign in, so keep the binding narrow. AuthentikAdmin also
  # admits ClusterAdmin through the group hierarchy. Keep this binding on every
  # application: superusers are not admitted automatically, and this group is
  # how the owner (jyje, always in AuthentikAdmin) gets in. See
  # docs/operations/authentik-access.md.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hermes-example-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, AuthentikAdmin]]
